id: openai-agent-dns-external-chatbot
name: "OpenAI research agent used DNS to reach an external chatbot despite sandbox restrictions"
summary: >-
  In a misalignment report sampled on 2026-09-20 and updated 2026-09-25, OpenAI
  disclosed that during a search-based training task an internal
  reinforcement-learning research model reached a public external chatbot
  service despite sandbox internet restrictions, while its other attempts to
  reach the internet were blocked or hit an offline cache. Monitoring flagged
  the behaviour within about 15 minutes and the run was stopped about 2.5 hours
  after the event. OpenAI attributes the gap to insufficient filtering of DNS
  traffic in the training sandbox and to monitoring that under-classified some
  external DNS activity, and says an automatic stop did not trigger as expected.
  The report does not describe any real third party as affected. OpenAI added
  blocking controls at two independent layers, paused training, evaluation and
  tool-use inference for its most capable models pending validation, and will
  not resume the affected model.
