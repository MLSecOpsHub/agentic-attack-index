    - CVE-2026-102490 # Zammad zero-day, per DIVD casefile (CISA KEV, added 2026-10-02).
  aiid: []
impact: >-
  Volunteer (DIVD) email addresses confirmed exfiltrated; signs of partial
  exfiltration from the GSuite office environment, helpdesk, Jira and
  Confluence, operational IT systems and the CSIRT ticket system; CSIRT
  correspondence and zero-day data held in Zammad should be assumed possibly
  compromised. HR, source code, Slack, accounting and the CVE/CNA environment
  show no indication of compromise. Investigation ongoing.
