id: skills-sh-paperclip-malicious-skills
name: "Typosquatted Paperclip and Browser Use skills on skills.sh told AI agents to fetch and run a credential stealer"
summary: >-
  On 2026-08-06 Zenity Labs disclosed an active malware campaign, which it
  helped disrupt, on skills.sh, an open registry of AI-agent skills that CSO
  Online says is maintained by Vercel. Using look-alike GitHub organisations,
  a single actor impersonated two projects: Paperclip, an AI-agent
  orchestration platform, and Browser Use, a browser-automation tool. The
  actor cloned the legitimate projects and listed their skills on skills.sh.
  The skills first appeared on 2026-07-05 as clean copies. The surrounding
  repository was trojanised on 2026-07-06. On 2026-07-11 the skill documents
  were weaponised with setup instructions telling AI agents to download and
  execute a remote payload, or to install from attacker-controlled sources
  instead of the real package. The malicious instructions sat in a secondary
  document that agents opened only when installation was needed, and the
  skills pointed agents to one another. The payload was a credential
  harvester targeting SSH keys, cloud, Git and package-manager credentials,
  Kubernetes and Docker configuration, project .env files and AI-tool
  configuration on developer workstations, CI runners and agent workspaces.
  Two companion trojanised PyPI packages were flagged within hours of
  publication. The skills trended on skills.sh throughout July. By 2026-08-02
  the family's displayed install counter exceeded 1.7 million; Zenity stresses
  this counter is aggregated and not unique per user, and that the number of
  victims is unknown. Zenity reports that Vercel and Microsoft/GitHub removed
  the listings and repositories within 12 hours of its outreach. AI agents
  were the execution vector, not the operator.
date_disclosed: 2026-08-06
status: reported # Only Zenity Labs had direct visibility of the skills.sh campaign; CSO Online repeats Zenity's findings. The OSV entry corroborates only a companion PyPI package and its skill lure. No Vercel or GitHub statement was found.
confidence: primary # Zenity detonated the skills and investigated the campaign directly.
category: infrastructure-abuse-supply-chain
severity: high # A credential stealer was distributed through trending agent skills with a very large install counter. The number of victims is unknown.
models: [] # No model is named.
model_families:
  - other # No source says which agents ran the malicious skills. CSO notes that Paperclip supports OpenClaw, Claude Code, OpenAI Codex and Cursor agents.
actor: "Unknown (a single GitHub account and look-alike organisations, per Zenity Labs)"
actor_type: unknown # Zenity profiles one account but states no motive or affiliation.
autonomy_pct: null
autonomy_level: not-applicable # Agents that loaded the skills were victims, not operators.
guardrail_bypass:
  - indirect-prompt-injection # Malicious instructions in third-party skill documents the agent loaded led it to fetch and run the stealer.
ai_role: significant # Agent-executed skill instructions were one of four trigger mechanisms Zenity recovered. The other three (package import, package postinstall, a loader in the cloned server code) did not depend on an agent.
related:
  - clawhavoc-clawhub-malicious-skills # Same technique: credential-stealing skills in an agent skill marketplace.
  - postmark-mcp-bcc-backdoor # Same technique: malicious packages distributed through AI-agent tooling ecosystems.
mitigations:
  - "Zenity Labs advises checking whether any agents or developer systems used the impersonating Paperclip or Browser Use skills or installed the companion packages, searching egress logs for the campaign's endpoints, and hunting for its published indicators."
  - "Zenity Labs advises treating an agent and its host as compromised if a malicious loader or stealer ran. Installation or use alone should be treated as exposure needing triage, and credentials should be rotated when execution cannot be ruled out."
  - "Vercel and Microsoft/GitHub removed the reported skills, listings and repositories within 12 hours of Zenity's outreach, per Zenity, which warns that copied instructions may remain in downstream repositories, aggregators and user machines."
targets:
  orgs_affected: null # Zenity: the number of unique victims is unknown. The 1.7 million figure is an aggregate install counter, not a victim count.
  records_exfiltrated: null
  sectors:
    - technology # Users of AI agent tooling. No victim sector is stated.
