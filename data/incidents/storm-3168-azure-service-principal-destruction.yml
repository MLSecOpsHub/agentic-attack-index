impact: >-
  Per Microsoft: most of the more than 100 targeted Azure Storage accounts
  were deleted, along with a Key Vault, Function App and App Service plan;
  deletions of Azure SQL databases and of Site Recovery and Backup protection
  locks were attempted and failed; more than 30 successful storage-account
  key-retrieval requests followed. No ransom note was observed and no
  exfiltration confirmed.
