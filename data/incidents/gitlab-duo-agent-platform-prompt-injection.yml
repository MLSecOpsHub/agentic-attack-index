id: gitlab-duo-agent-platform-prompt-injection
name: "GitLab Duo Agent Platform — prompt injection into agent instructions (CVE-2026-96893)"
summary: >-
  GitLab's critical patch release of 2026-10-12 (19.4.2, 19.3.5, 19.2.8) fixed
  CVE-2026-96893, an "Improper Neutralization of Input Used for LLM Prompting"
  issue in the GitLab Duo Agent Platform in GitLab EE. Under certain conditions
  an authenticated user could inject crafted content into AI agent
  instructions, potentially causing the agent to execute unintended commands
  attributed to other users, because of improper neutralisation of special
  elements in AI conversation context construction. GitLab rated it CVSS 7.3;
  it was found internally by a GitLab team member, and no public
  proof-of-concept write-up exists.
date_disclosed: 2026-10-12 # GitLab patch release page; NVD published 2026-10-13.
status: confirmed # Not observed in the wild (the release makes no exploitation statement). First-party GitLab advisory with an assigned CVE and fix.
confidence: primary # GitLab is the vendor and the finder.
category: agent-hijack-prompt-injection
severity: high # CVSS 7.3 per GitLab.
models: [] # Not stated by GitLab.
model_families:
  - other
actor: "GitLab (internal finding by team member Mert Coskuner)" # Credit line on the GitLab release page.
actor_type: researcher # The finder is GitLab's own engineer, not an external researcher; no adversary.
autonomy_pct: null
autonomy_level: not-applicable # The agent was the vulnerable component.
guardrail_bypass:
  - indirect-prompt-injection # Crafted content injected into agent instructions acting for other users (GitLab).
ai_role: load-bearing
related: []
mitigations:
  - "Upgrade self-managed GitLab EE to 19.4.2, 19.3.5 or 19.2.8; GitLab.com and GitLab Dedicated were already patched (GitLab)."
