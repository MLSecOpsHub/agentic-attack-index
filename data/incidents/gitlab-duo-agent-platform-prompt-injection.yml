impact: >-
  Per GitLab: potential unintended command execution by the Duo Agent Platform
  attributed to other users in GitLab EE 19.1 before 19.2.8, 19.3 before 19.3.5
  and 19.4 before 19.4.2. CVSS 7.3. No exploitation reported.
