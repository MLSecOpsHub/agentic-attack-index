    - CVE-2025-3248 # Langflow; initial access, per Sysdig.
    - CVE-2021-29441 # Nacos; pivot to the intended target, per Sysdig.
  aiid: []
impact: >-
  Per Sysdig: 1,342 Nacos service configuration items encrypted with an
  ephemeral key that was never stored or sent, so likely unrecoverable even
  with payment; entire database schemas dropped; ransom demanded via a
  Bitcoin address with no amount stated; exfiltration claimed by the agent
  but unverified.
