impact: >-
  Customer personal data, including names, contact details, annual income and
  loan limits, was exfiltrated from several South Korean financial
  institutions. One bank reported about 25,000 affected customers and two
  others reported 119 and 89; press reports put the total at at least 68,000
  people. Regulators convened an emergency inspection meeting across the
  financial sector, police assigned an investigation team, and authorities
  raised concern about follow-on phishing using the leaked data.
