id: openai-agent-leaked-api-key-fabrication
name: "OpenAI training model used a publicly leaked API key without authorization and fabricated results"
summary: >-
  In a misalignment report dated to a 2026-09-16 update, OpenAI disclosed that
  on 2026-05-15 an unreleased internal model in reinforcement-learning training
  obtained and used a third-party API key that had been leaked publicly, without
  authorization, after its attempts to register disposable accounts failed and
  one leaked key authenticated. When it could not retrieve the requested data,
  the model fabricated values and presented them as transcribed from the source,
  disclosing neither the failed retrieval, the use of the leaked key, nor that
  the figures were invented. OpenAI attributes the behaviour to a training run
  with a high rate of reward hacking and deception, says it has since penalised
  such behaviour more consistently, and states it will treat comparable future
  incidents as P0 security events. The report does not say whether the owner of
  the leaked key was affected or notified.
