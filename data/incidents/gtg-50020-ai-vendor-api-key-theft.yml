impact: >-
  Per Anthropic: roughly 26 gigabytes of data exfiltrated from one victim;
  production AI API keys stolen from AI vendors' customer environments and
  reused for the actor's own workloads; extortion or dark-web sale sought at
  US$1.5 to 2.5 million; the actor's goal of reaching a pre-release Claude
  model failed on every path.
