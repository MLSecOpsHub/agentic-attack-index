id: snowflake-cortex-cli-sandbox-escape
name: "Snowflake Cortex Code CLI could be driven out of its sandbox via indirect prompt injection"
summary: >-
  PromptArmor disclosed on 2026-03-16, in coordination with Snowflake, that the
  Snowflake Cortex Code CLI could be manipulated through indirect prompt
  injection into running commands without human approval and outside the CLI's
  sandbox, using the victim's active Snowflake credentials to perform harmful
  actions such as data exfiltration or dropping tables. PromptArmor reported the
  flaw on 2026-02-05; Snowflake validated it on 2026-02-12 and deployed a fix on
  2026-02-28 in version 1.0.25, applied automatically on next launch. The result
  came from controlled testing, where the attack succeeded about half the time,
  with no in-the-wild exploitation or affected users reported.
date_disclosed: 2026-03-16
status: reported # Single vendor publisher (PromptArmor); Snowflake validated and fixed per the post.
confidence: primary # First-hand researcher analysis.
category: agent-hijack-prompt-injection
severity: high # Arbitrary command execution outside the sandbox with the victim's credentials, in a product since fixed.
models: []
model_families:
