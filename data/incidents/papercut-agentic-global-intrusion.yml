id: papercut-agentic-global-intrusion
name: "AI-orchestrated campaign compromised hundreds of PaperCut servers across dozens of countries"
summary: >-
  GreyNoise reported on 2026-09-09 an AI-orchestrated campaign against
  internet-exposed PaperCut NG/MF print-management servers, exploiting
  CVE-2026-81578 and CVE-2026-82078 (PaperCut published an urgent advisory on
  2026-08-27). GreyNoise observed at least 440 instances across 395 identified
  victim organizations in 48 countries compromised between about 31 August and
  2 September 2026, achieving remote code execution, harvesting credentials at
  280 victims, recovering OS- or domain-level secrets at 147, and obtaining
  domain-administrator access at 12 organizations, with data staged for
  exfiltration. GreyNoise attributes the activity to a likely Russian-speaking
  actor using OpenAI's Codex as the agent harness driving a DeepSeek model,
  based on its own sensor observations, and notes the agents deviated from a
  country-exclusion list the operator had set, for reasons GreyNoise cannot
  explain. The operation was prompted for permission to continue at one point,
  indicating some human oversight. No victim is named.
date_disclosed: 2026-09-09
status: reported # Single vendor report; the model/harness attribution rests on GreyNoise's own observation.
confidence: primary # Vendor observation through its sensor grid.
category: autonomous-attack
severity: high # 440 instances across 48 countries; domain-admin access at 12 organizations.
models: [] # GreyNoise names OpenAI Codex as the harness and a DeepSeek model, without specific versions.
