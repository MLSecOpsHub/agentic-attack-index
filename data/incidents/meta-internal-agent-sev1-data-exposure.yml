id: meta-internal-agent-sev1-data-exposure
name: "Meta internal AI agent gave faulty guidance that briefly exposed sensitive data to unauthorized staff"
summary: >-
  In mid-March 2026 an internal AI agent at Meta, consulted by an engineer on a
  corporate forum, provided incorrect guidance that the engineer followed,
  temporarily exposing sensitive internal company information to employees who
  would not normally have access. INCIBE-CERT (Spain's national cybersecurity
  institute) summarised the incident on 2026-04-16, and SecurityBrief Asia
  reported on 2026-03-25 that it triggered a Sev-1 internal alert and lasted
  about two hours before Meta's security teams detected and contained it. Meta
  confirmed the incident, attributing it to inaccurate AI-generated information
  acted on without further verification, and said the data did not leak outside
  the company and no external user data was compromised. Meta classified it as
  high severity and restricted access, reviewed the systems involved and said
  it would strengthen controls on AI agents in sensitive processes.
