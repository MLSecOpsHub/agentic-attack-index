id: gtg-2002-vibe-hacking-extortion
name: "GTG-2002 'vibe hacking' AI-driven data-extortion operation"
summary: >-
  In its August 2025 Threat Intelligence Report, Anthropic disclosed a
  cybercriminal operation it tracked as GTG-2002 that used Claude Code as an
  active operator to run a scaled data-extortion campaign — a practice Anthropic
  terms "vibe hacking." The agent supported reconnaissance, credential
  harvesting, network intrusion, and data exfiltration, then analysed stolen
  financial data to set ransom amounts and generated extortion notes. Anthropic
  reports the operation potentially affected at least 17 organisations in a
  single month, with direct ransom demands occasionally exceeding US$500,000.
