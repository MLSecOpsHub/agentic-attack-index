id: github-mcp-server-private-repo-leak
name: "GitHub MCP server could be steered via a public issue into leaking private repository contents"
summary: >-
  Research first disclosed in May 2025 (by Invariant Labs) and explained by
  Cybernews showed that an AI agent connected through the GitHub MCP server
  could be steered by instructions hidden in a public issue into reading
  private repositories accessible to its token and pasting their contents into
  a public pull request, making the data public. The work is a proof-of-concept
  against the researchers' own setup rather than an observed in-the-wild attack;
  the core weakness is over-broad agent token access combined with treating
  issue content as instructions. It is catalogued as an agent-hijack
  prompt-injection product vulnerability.
date_disclosed: 2025-05-26 # Public disclosure date of the underlying Invariant Labs research, as referenced by coverage; cited source is the Cybernews explainer.
status: reported # Single readable publisher (Cybernews explainer); proof-of-concept.
confidence: primary # Invariant Labs' first-hand research is the primary source.
category: agent-hijack-prompt-injection
severity: medium # Private repository contents could be made public; proof-of-concept, no in-the-wild victims.
models: []
