id: gentlemen-hermes-agent-gitlab-extortion
name: "Exposed server reveals AI-agent ransomware operation that stole 3.1 TB from 30+ GitLab victims"
summary: >-
  Cybernews reported on 2026-09-02 that its researchers found an exposed server
  holding 3.1 TB of data stolen from more than 30 companies, running what it
  describes as a ransomware operation driven by an AI agent (which the toolset
  calls a Hermes harness) and attributed by ransom notes to the group "The
  Gentlemen." The operation targeted vulnerable and misconfigured GitLab
  instances using compromised credentials for initial access, used AI-generated
  Python scripts configured with real victim endpoints for post-exploitation,
  and drafted ransom demands, backing stolen data up to a cloud storage service.
  Cybernews estimates AI token cost of roughly US$0.40 to US$4 per company
  attacked and says the agent hacked and extorted dozens of victims
  simultaneously with little human oversight. Victims are not named. The AI-
  agent characterisation and automation claims are the researchers' assessment
  of the exposed infrastructure.
date_disclosed: 2026-09-02
