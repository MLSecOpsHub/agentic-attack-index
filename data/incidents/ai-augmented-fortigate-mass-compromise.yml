# Id note: the triage lead proposed "cyberstrikeai-fortigate-mass-compromise".
# Not used. Amazon's primary report does not name CyberStrikeAI. The tool link
# comes from a later Team Cymru infrastructure finding, and BleepingComputer
# says that finding does not show the tool carried out the intrusions.
id: ai-augmented-fortigate-mass-compromise
name: "AI-augmented actor accessed more than 600 FortiGate devices across 55+ countries; attack infrastructure later found running the CyberStrikeAI agent platform"
summary: >-
  On 2026-02-20 Amazon Threat Intelligence (CISO CJ Moses) reported that a
  Russian-speaking, financially motivated actor used multiple commercial
  generative AI services to compromise more than 600 FortiGate devices in
  more than 55 countries between 2026-01-11 and 2026-02-18. No FortiGate
  vulnerability was exploited. Access came through internet-exposed
  management interfaces and weak single-factor credentials, followed by
  extraction of device configurations. The actor used the stolen credentials
  to enter victim networks and reached Active Directory compromise and
  credential-database extraction in several organisations. It also targeted
  backup servers, which Amazon calls consistent with pre-ransomware activity.
  Amazon found the actor's operational files on its own publicly accessible
  infrastructure. They showed at least two commercial LLM providers used for
  tool development, attack planning, command generation and operational
  reporting, including a request for a plan to compromise further hosts
  inside a live victim network. Amazon assesses the actor as low-to-medium
  skill, and says it largely failed beyond straightforward automated attack
  paths and moved on from hardened targets. On 2026-03-02 Team Cymru reported
  a "CyberStrikeAI" service banner on one of the IPs Amazon shared. Team
  Cymru describes CyberStrikeAI as an open-source, AI-native offensive
  platform with an orchestration engine. It also observed NetFlow traffic
  between that IP and targeted FortiGate devices. No source shows how much of
  the campaign, if any, an AI agent executed. The agentic link rests on
  infrastructure overlap.
date_disclosed: 2026-02-20
# Reported, not confirmed: the campaign and its AI use rest on Amazon's
# investigation alone. Team Cymru independently corroborates FortiGate targeting
# from the actor's IP but makes no claim about the AI planning. The Record and
# BleepingComputer relay the two reports without independent verification. No
# victim or government statement was found.
status: reported
confidence: primary # Amazon analysed the actor's exposed operational files directly.
category: ai-orchestrated-campaign
severity: high # 600+ devices in 55+ countries, domain credential databases taken and backup servers targeted. No ransomware deployment is reported.
models: [] # Amazon names no LLM provider or model. CyberStrikeAI is a platform, not a model.
model_families:
  - other
actor: "Unknown Russian-speaking, financially motivated individual or small group (per Amazon Threat Intelligence)"
actor_type: cybercriminal # Amazon: "likely a financially motivated individual or small group", not known to be linked to any APT. Team Cymru's state-tie assessment concerns the tool's developer, not this actor.
autonomy_pct: null
# Amazon describes a human operator who executed AI-generated plans and
# AI-written tooling, which is tool-assisted. Team Cymru found an AI agent
# orchestration platform running on the attack infrastructure, which could
# mean more autonomy. Neither source says how much ran unattended.
autonomy_level: unknown
guardrail_bypass:
  - unknown # Amazon does not say how the commercial services' safeguards were handled.
# Amazon: the actor reached a scale that "would have previously required a
# significantly larger and more skilled team", and the AI dependency covered
# all operational phases. Agentic execution is not shown: CyberStrikeAI's
# role rests on Team Cymru's banner and NetFlow overlap.
ai_role: significant
related: []
mitigations:
  - "Amazon advises keeping FortiGate management interfaces off the internet (or restricted to known IP ranges via a bastion or out-of-band network), changing default and common credentials, rotating SSL-VPN credentials, enforcing multi-factor authentication for administrative and VPN access, and reviewing configurations for unauthorised accounts or policy changes."
  - "Amazon advises auditing password reuse between VPN and Active Directory accounts, monitoring for unexpected domain replication and lateral movement from VPN address pools, and isolating, patching and keeping immutable copies of backup infrastructure. It prioritises behavioural detection over indicators, because the actor relied on widely used open-source tools."
  - "Team Cymru advises monitoring for its published CyberStrikeAI server indicators and preparing for more automated, AI-driven targeting of edge devices."
targets:
  orgs_affected: null # Amazon counts devices (600+), not organisations. It says multiple organisations' Active Directory environments were compromised but gives no number.
  records_exfiltrated: null
  sectors: [] # Amazon calls targeting opportunistic rather than sector-specific.
  countries: [] # Amazon gives regions only (South Asia, Latin America, the Caribbean, West Africa, Northern Europe, Southeast Asia).
lifecycle_phases:
  - resource-dev
  - recon
  - initial-access
  - execution
  - credential-access
  - privilege-escalation # Domain-level compromise via Active Directory credential extraction.
mappings:
  mitre_atlas: []
  mitre_attack: []
  owasp_llm: []
  owasp_asi: []
  cve: # Listed in the actor's operational notes per Amazon; Amazon says exploitation beyond straightforward paths largely failed.
    - CVE-2019-7192
    - CVE-2023-27532
    - CVE-2024-40711
  aiid: []
impact: >-
  Per Amazon: more than 600 FortiGate devices in more than 55 countries
  accessed and their configurations taken, including VPN and administrative
  credentials and network topology. Several organisations' Active Directory
  environments were compromised and complete domain credential databases
  extracted. Backup infrastructure was targeted, which Amazon calls a
  potential precursor to ransomware. No ransomware deployment, data sale or
  named victim is reported.
