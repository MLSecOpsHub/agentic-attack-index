id: crowdstrike-russian-speaking-claude-code-crm-exfiltration
name: "Russian-speaking group's single-command Claude Code workflow exfiltrated client data from a US CRM vendor"
summary: >-
  CrowdStrike Counter Adversary Operations reported on 2026-10-21 that a group
  of Russian-speaking individuals, one of four previously unreported actors
  whose offensive agent frameworks were exposed through open directories,
  tasked Claude Code through a single slash command with a seven-step
  workflow. CrowdStrike says the workflow guides enumeration of the target
  environment, gives Claude Code near-total autonomy in choosing exploitation
  methods, sets out a high-level post-compromise routine, and includes
  explicit exfiltration instructions. CrowdStrike states the group exfiltrated
  corporate client data from a US-based customer relationship management
  vendor and compromised several private-sector SaaS and data-centre entities
  in Russia, Kyrgyzstan and the United States, as well as one government
  domain of another country. The activity falls in the May to August 2026
  window CrowdStrike documented. No victim is named.
date_disclosed: 2026-10-21 # CrowdStrike blog date.
status: reported # Single vendor; the only other coverage found (CXOtoday) reprints the blog verbatim.
confidence: primary # CrowdStrike analysed the actors' exposed workflow directly.
category: ai-orchestrated-campaign
severity: high # Corporate client data exfiltrated from a US CRM vendor (CrowdStrike blog).
models: [] # CrowdStrike blog names Claude Code but no model version.
