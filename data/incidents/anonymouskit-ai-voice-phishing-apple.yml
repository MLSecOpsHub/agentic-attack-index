id: anonymouskit-ai-voice-phishing-apple
name: "AnonyMousKIT: AI-voice phishing-as-a-service for unlocking stolen Apple devices"
summary: >-
  SOCRadar's Threat Research Unit published on 2026-08-24 (with an update on
  2026-08-31) an analysis of AnonyMousKIT, a credit-metered
  phishing-as-a-service platform engineered to disable Apple's Activation Lock
  on stolen devices. The platform automates credential harvesting across email,
  SMS and WhatsApp and uses rented commercial AI voice agents to place
  automated social-engineering calls impersonating Apple Support, inserting
  real device details obtained from the stolen hardware. SOCRadar's inside-out
  investigation unraveled a reseller supply chain of 506 domains and 168
  storefront brands active since early 2024, and operator telemetry showing
  6,092 phishing emails against targeted devices, of which thousands were
  online. The funnel harvests the device passcode, Apple ID and the
  second-factor code to remove Activation Lock. Operators are identified only
  by platform handles; no model vendor is named and no victim is named.
date_disclosed: 2026-08-24
