id: aurora-cursor-agent-ransomware
name: "Aurora ransomware operators used the Cursor coding agent during intrusions across victim networks"
summary: >-
  Gambit Security reported on 2026-08-27 that an operator affiliated with the
  Aurora ransomware group, which runs a data-leak site and deploys Linux/ESXi
  ransomware, used the Cursor coding agent running a Claude Sonnet 4.5 model to
  support hands-on intrusion work. Gambit describes two clusters: one linked to
  a single operator with activity between 2026-04-08 and 2026-05-21 against ten
  organizations, and a second attributed with medium confidence against eight
  organizations in Israel, Germany, Austria, Spain, the United States and
  Argentina, with data exfiltrated to cloud storage and one victim's data
  published on the leak site. Reuters (via Insurance Journal) names some
  victims, reports the operators as Russian-speaking, and cites an estimate
  that the agent made the attackers 30 to 50 percent faster. Gambit assesses
  the agent's autonomy as low to moderate: the operator directed the work and
  selected proposed steps, many commands failed and needed revision, and the
  agent sometimes produced only a report of failed attempts.
