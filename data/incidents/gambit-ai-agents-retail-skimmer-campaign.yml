  - gtg-50014-agentic-mass-exfiltration
mitigations:
  - "Gambit recommends a resilience-first posture, identifying the minimum systems needed to keep revenue flowing, verifying recovery under campaign-like conditions, and aligning tooling and response with machine-speed attacks rather than human-paced change windows."
