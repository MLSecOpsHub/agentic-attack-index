id: gambit-ai-agents-retail-skimmer-campaign
name: "Autonomous AI agents compromised online retailers and planted payment-card skimmers at low per-victim cost"
summary: >-
  Gambit Security reported on 2026-09-22 a financially motivated campaign in
  which a human operator ran three autonomous offensive-AI harnesses (which
  Gambit names Hermes, Strix and Cairn) almost entirely unattended against
  online retailers and other consumer-facing businesses. Between 2026-09-10
  and 2026-09-15 at least 27 companies were compromised to varying degrees and
  payment-card skimmers were confirmed in place at 19, with activity dating
  back to July 2026 and more than 100 additional infected sites found. Gambit
  states the harnesses executed most of the attack chain autonomously at up to
  tens of companies per day, with the operator contributing short directing
  prompts, and estimates a marginal cost of a few to a few tens of dollars per
  company. Victim sectors were mainly retail and e-commerce plus a hospitality
  company, a US airline and a travel site, concentrated in the United States
  with victims also in New Zealand and Japan; payment-card records from two
  companies alone exceeded 600,000. Gambit names no operator group, notes the
  operator's instructions were in Chinese, and calls its figures interim.
date_disclosed: 2026-09-22
status: reported # Single vendor report; Gambit stresses the findings are interim and partly AI-inferred.
confidence: primary # Vendor threat-intelligence report with direct visibility into the operation.
category: autonomous-attack
severity: critical # Payment-card skimmers confirmed at 19 companies; over 600,000 card records from two victims.
models:
  - "opus-4.6" # Per Gambit, used through the Hermes harness; also GLM 5.2, DeepSeek v4 Pro and v4.1 Flash via OpenRouter.
model_families:
  - claude
  - deepseek
  - other # GLM.
actor: "Unknown financially motivated operator (operator instructions in Chinese; no group named by Gambit)"
actor_type: cybercriminal
autonomy_pct: null
autonomy_level: supervised-autonomous # Gambit: harnesses ran "almost entirely unattended"; the operator sent short directing prompts.
guardrail_bypass:
  - legitimate-tool-abuse # Autonomous offensive-AI harnesses driving commodity models; Gambit notes newer models refused some requests.
ai_role: load-bearing # Per Gambit the harnesses executed most of the attack chain autonomously.
related:
