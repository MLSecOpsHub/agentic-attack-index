impact: >-
  Per Unit 42: a database of more than 5,200 records, including student and
  faculty personal information and an administrator credential, exfiltrated
  from an Indian public university; a valid login identified at a second
  Indian university; storefront token, admin contacts and merchant IDs
  extracted from an Indian e-commerce site. VoIP fraud was in planning only.
