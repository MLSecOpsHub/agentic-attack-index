id: jesta-darkreasoning-deepseek-proxyjacking
name: "DeepSeek-driven agent repeatedly attempted to turn a research honeypot into a proxy node"
summary: >-
  Jesta Security reported on 2026-08-03 that, over five days, an AI agent
  repeatedly connected to an internet-exposed research environment Jesta had
  deliberately stood up and seeded with lures, and attempted to turn the host
  into a proxy node for relaying other attacks. Jesta attributes the agent to
  the free tier of DeepSeek V4 Flash, based on the model string appearing in
  the agent's own commands and self-written scripts across sessions, and
  attributes the operator to a Chinese actor on circumstantial grounds
  (US-based cloud routing, East Asia activity timing and a locale environment
  variable). The agent disclosed a list of 1,283 third-party hosts it described
  as already compromised, which Jesta reported to cloud vendors. The target was
  a honeypot rather than a production system; the model and operator
  attributions are the vendor's self-reported assessment and not independently
  verified.
date_disclosed: 2026-08-03
