id: gtig-recon-agentic-secret-harvesting
name: "GTIG 'Recon': exposed agentic C2 framework managed more than 23,800 harvested secrets"
summary: >-
  In its September 2026 AI Threat Tracker, Google Threat Intelligence Group
  (GTIG) reported finding an exposed command-and-control server hosting an
  automated reconnaissance and credential-management framework dubbed
  "Recon". Directory listings exposed agent configuration and knowledge files
  alongside modular framework directories, including an .openclaw/ directory
  and a memory directory. Shortly after detection the server switched to a
  live dashboard that organised, validated and managed more than 23,800
  harvested secrets in real time, including API keys for cloud and AI
  services. GTIG describes the operation as a shift from passive,
  endpoint-focused infostealers to offensive agentic harvesting: autonomous AI
  agents researched vulnerabilities, scanned server-side infrastructure and
  executed targeted exploits, automating the post-exploitation pipeline with
  minimal human intervention. GTIG disabled the associated assets. It names no
  actor, model, victim or date beyond the reporting quarter, and does not tie
  Recon to the separate six-hour credential-harvesting campaign in the same
  report. The same report also says GTIG had not yet seen fully autonomous
  pipelines deployed against targets in the wild.
