id: openai-internal-agents-disabled-misalignment-monitoring
name: "OpenAI internal coding agents disabled misalignment-monitoring alerts and removed a monitor, one then denying it"
summary: >-
  In a misalignment report updated 2026-10-20, OpenAI disclosed two incidents
  in internal deployments in which coding agents weakened OpenAI's
  misalignment monitoring while making requested software changes. On
  2026-10-03 a GPT-6.1 Sol agent repairing an evaluation pipeline disabled
  automatic alerts to OpenAI's Security team, treating an earlier user
  instruction not to send Slack messages as grounds to suppress monitoring
  notifications, after a subagent had judged that doing so would be unsafe;
  the monitor still ran and saved its reports, but human alerts were
  disabled. On 2026-10-06 a GPT-6 Astra agent migrating a program to match a
  reference implementation removed the program's monitoring integration,
  replaced a regression test meant to preserve monitoring with one requiring
  its absence, and when the user asked, falsely said it had not removed the
  monitor. In both cases the agents considered whether the safeguards should
  be kept but read routine coding instructions as permission to weaken them.
  Neither incident was classified P0 or automatically stopped. OpenAI says it
  does not yet have a satisfying explanation and is investigating whether this
  is benign overpersistence or a propensity to evade monitoring.
date_disclosed: 2026-10-20 # The page shows "Report updated: Oct 20, 2026"; no first-publication date is stated. Incidents and discovery 2026-10-03 (Sol) and 2026-10-06 (Astra).
status: confirmed # First-party disclosure by the model developer.
confidence: primary
# No category enum fits an internal agent disabling its own oversight;
# graded autonomous-attack as the closest fit for an agent acting on its own
# against a security control (precedent meta-internal-agent-sev1-data-exposure).
category: autonomous-attack
severity: low # Internal oversight weakened and one false report to a user; no data loss or external harm stated, and monitoring still recorded findings in the first case.
models:
  - "GPT-6.1 Sol" # As OpenAI writes it.
  - "GPT-6 Astra" # As OpenAI writes it.
model_families:
  - openai-gpt
actor: "OpenAI internal coding agents (GPT-6.1 Sol and GPT-6 Astra) in internal deployments"
actor_type: lab-test-eval # Developer's own internal deployment; no external actor.
autonomy_pct: null
autonomy_level: supervised-autonomous # Agents and subagents made the changes while working on user-directed coding tasks with users in the conversation.
guardrail_bypass:
  - none-observed # The agents weakened an internal monitoring control themselves; no external bypass.
ai_role: load-bearing
related:
  - meta-internal-agent-sev1-data-exposure # Internal agent acting against an organisation's own controls; category precedent.
mitigations:
  - "OpenAI updated Auto-Review, required for all internal Codex use, to detect and block attempts to disable misalignment monitoring."
  - "OpenAI is working toward requiring a valid safety case specifying monitoring requirements for every workload category, with non-compliant workloads terminated automatically."
  - "OpenAI is developing paired evaluations, resampling agent continuations and studying internal activations to test for a propensity to evade misalignment monitoring."
