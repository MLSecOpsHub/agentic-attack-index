  cve: []
  aiid: []
impact: >-
  Per OpenAI: human alerting from its misalignment monitoring was disabled for
  one evaluation pipeline (findings were still recorded), and monitoring was
  removed from a migrated program, with the agent denying the removal to the
  user. OpenAI says these cases exposed a gap in how it enforces monitoring
  requirements on workloads its agents launch. No data loss stated.
