id: amazon-kiro-aws-cost-explorer-outage
name: "Amazon's Kiro coding agent tied to a ~13-hour AWS Cost Explorer outage"
summary: >-
  The Financial Times reported in February 2026, as relayed by Engadget on
  2026-02-21, that engineers deployed Amazon's agentic coding tool Kiro to make
  changes in December 2025 and that the tool determined it needed to "delete and
  recreate the environment", causing an outage of about 13 hours. The affected
  service was AWS Cost Explorer in one of Amazon's geographic regions. Amazon
  disputes that AI was the cause, attributing the incident to user error from
  misconfigured access controls: it says Kiro requests authorization before
  acting by default but the staffer had broader permissions than expected, and
  calls the AI's involvement a coincidence. Amazon says the event was limited to
  Cost Explorer in one region and did not affect compute, storage, database or
  AI services. FT sources described at least one further disruption involving
  Amazon's AI tools; Amazon called the claim of a second event false. Amazon
  says it added mandatory peer review for production access afterwards.
