id: blackhatsect0r-hermes-dxscan-harvesting
name: "French-speaking crew paired a safety-disabled Hermes agent with a mass-scanning C2 that harvested 16,834 credentials"
summary: >-
  SOCRadar reported on 2026-09-16 its analysis of an exposed operation server
  belonging to BlackHatSect0r && DXQRTXX, a French-speaking cybercrime crew
  that combines credential theft, data resale and extortion with hacktivist
  messaging. A custom Go command-and-control platform, DXSCAN, ran an
  automated pipeline that generated random IP addresses across twelve
  countries, fingerprinted hosts, searched exposed configuration files for
  secrets and sent reports to Telegram; its dashboard showed 16,834
  credentials harvested and 726,989 hosts reached. SOCRadar describes an AI
  layer in which the operator ran a Nous Research Hermes agent against a
  DeepSeek model, deleted the agent's recorded refusals and its "discernment
  retained" memory line, rewrote its identity file to forbid refusal, disabled
  the framework's approval, secret-redaction and safety controls, and set
  worker daemons to run campaigns continuously without an operator present.
  Activity in the dataset includes claimed breaches of two French public
  bodies through exposed cloud storage and configuration files, an extortion
  portal claiming compromise of four New York public bodies' cloud storage,
  reconnaissance and token forgery against a French government fine-payment
  portal, theft of 418 identity records from a cryptocurrency exchange, a
  French telecom subscriber database of 449,970 records, and a bank-
  impersonation vishing campaign aimed at older account holders. SOCRadar
  stresses that every confirmed breach came from exposure, not novel
  exploitation, and that the crew's zero-day claims do not hold. Per SOCRadar's
  own timeline the credential vault and the two French breaches predate the
  agent's installation in late July 2026, and ThreatMon's separate analysis of
  the same exposed server describes the targeted operations as manual work
  and does not mention an AI agent.
# Victim naming: SOCRadar names several victims, mostly from the crew's own
# public claims; none has been confirmed here by a first-party or government
# disclosure, so the record uses sector and country only.
date_disclosed: 2026-09-16
status: reported # The server and crew are corroborated by ThreatMon's independent analysis, but the AI-agent element is SOCRadar's alone.
confidence: primary # SOCRadar statically analysed the exposed directory and passively observed the live C2 panel.
category: ai-orchestrated-campaign
severity: high # Government and public-sector targeting, 16,834 harvested credentials, identity-data theft, extortion and fraud against individuals.
models: [] # SOCRadar names a DeepSeek model without a version.
model_families:
  - deepseek
actor: "BlackHatSect0r && DXQRTXX (French-speaking cybercrime crew, per SOCRadar; operates publicly 'in alliance with' APT-90, which SOCRadar treats as a co-branding partner)"
actor_type: cybercriminal
autonomy_pct: null
autonomy_level: supervised-autonomous # Per SOCRadar: worker daemons ran continuously without an operator present; the operator dictated objectives.
guardrail_bypass:
  - jailbreak # Operator deleted the agent's recorded refusals and rewrote its identity file to forbid refusal.
  - legitimate-tool-abuse # Stock open-source Hermes agent with approval, redaction and safety settings switched off.
# ai_role: SOCRadar says the agent supplied endurance and parallelism ("a large
# language model does the work of a team"), but its own timeline puts the
# credential vault (from 5 July) and the French breaches (8-10 July) before the
# agent was installed (25-27 July); the mass harvesting is done by the Go
# scanner; and ThreatMon's analysis of the same server attributes the targeted
# operations to manual work and does not mention AI. Graded disputed.
ai_role: disputed
related:
  - unit42-hermes-deepseek-autonomous-campaign # Same pairing of the Hermes agent with a DeepSeek model; separate actor.
  - gentlemen-hermes-agent-gitlab-extortion # Another criminal operation built on a Hermes agent; separate actor.
  - thailand-mof-hermes-agent-intrusion # Same technique: the open-source Hermes Agent run against real targets; no actor link stated.
  - carbonato-docker-hermes-botnet # Same technique: the open-source Hermes Agent run against real targets; no actor link stated.
mitigations:
  - "SOCRadar advises auditing object storage for public read and write access, removing .env, .git, debug and actuator endpoints from public reach, keeping token-signing material server-side, and rotating default or guessable signing secrets."
  - "Treat a SOUL.md file, a .hermes/ directory or a HERMES_DISABLE_SAFETY setting on a server as a high-confidence indicator of an agentic-attack toolchain, and alert on unexpected Telegram bot API and ngrok traffic from servers."
  - "Detect the scanning pattern: bursts of probes followed immediately by requests for well-known configuration-file paths from one source."
