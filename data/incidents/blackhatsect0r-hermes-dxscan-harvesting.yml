impact: >-
  Per SOCRadar: 16,834 credentials harvested from exposed configuration files;
  claimed breaches of two French public bodies via exposed storage and
  configuration; extortion claims against four New York public bodies; 418
  complete identity records taken from a cryptocurrency exchange (no funds
  moved); a 449,970-record French telecom subscriber database held and
  monetised; and a vishing lure sent to 668 recipients. ThreatMon's analysis
  of the same server counted 16,415 credentials and about 498,000 target URLs.
