  records_exfiltrated: null # "hundreds of megabytes" of student data and citizen records; no record count stated.
  sectors:
    - education
    - retail
    - energy
    - technology
    - healthcare
    - financial-services
    - government
    - manufacturing # Off-vocabulary, kept as stated.
  countries:
    - CN # Anthropic: hands-on intrusion activity "concentrated exclusively on domestic Chinese victims".
# No geo block: the operator location is hedged ("likely") and actor_type is
# unknown, which bars actor-location/operator-location points; no target
# country beyond "domestic Chinese victims" and regions is stated.
lifecycle_phases:
  - recon
