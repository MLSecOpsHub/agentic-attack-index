impact: >-
  Per Anthropic: hundreds of megabytes of bulk student personal data taken from
  an education-technology company's cloud storage; citizen records (names,
  phone numbers, home addresses) from a Southeast Asian government agency;
  access to a retail company's production systems with the ability to modify
  the live environment; multiple previously unknown vulnerabilities discovered.
