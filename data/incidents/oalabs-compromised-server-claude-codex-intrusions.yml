    - role: origin
      basis: actor-location
      attributed_by: "OALABS"
      country: ET
      lat: 9.15
      lng: 40.49
      label: "Ethiopia (operator location stated by OALABS researchers from the recovered logs)"
      illustrative: true
lifecycle_phases:
  - recon
  - resource-dev # Stolen Claude Code instance; compromised hosts reused as staging servers.
  - initial-access
  - execution
  - privilege-escalation # Public Linux local privilege-escalation exploits among those the agent built and ran.
  - credential-access
  - exfiltration
mappings:
  mitre_atlas:
    - AML.T0016.002 # Obtain Capabilities: Generative AI
    - AML.T0017.001 # Develop Capabilities: Autonomous Exploit Development
    - AML.T0054 # LLM Jailbreak
    - AML.T0102 # Generate Malicious Commands
    - AML.T0116 # Autonomous Reconnaissance
    - AML.T0117 # Autonomous Attack-Path Adaptation
    - AML.T0124 # Autonomous Attack Orchestration
  mitre_attack: []
  owasp_llm: []
  owasp_asi: []
  cve: # Vulnerabilities OALABS says the agent turned into exploits and used.
    - CVE-2025-54068 # Livewire
    - CVE-2025-62168 # Squid
    - CVE-2025-5777 # Citrix
    - CVE-2023-36664 # Ghostscript
    - CVE-2024-29510 # Ghostscript
    - CVE-2021-4034 # Linux local privilege escalation
    - CVE-2022-0847 # Linux local privilege escalation
  aiid: []
impact: >-
  Per OALABS: at least 14 companies breached, with credentials and data
  harvested and exfiltrated; an encrypted wallet file from a Lightning Network
  node with access to about 69.71 BTC (about US$4 million) exfiltrated, though
  distributed cracking failed; and 14 compromised hosts, many belonging to a
  Southeast Asian government server farm, repurposed for the cracking. No
  successful monetization was confirmed in the logs.
