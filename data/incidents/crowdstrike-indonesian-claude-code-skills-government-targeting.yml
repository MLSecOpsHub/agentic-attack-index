id: crowdstrike-indonesian-claude-code-skills-government-targeting
name: "Indonesian-speaking actor directed Claude Code with 819 public skills to compromise government domains"
summary: >-
  CrowdStrike Counter Adversary Operations reported on 2026-10-21 that an
  Indonesian-speaking actor, the least sophisticated of four previously
  unreported actors whose offensive agent frameworks were exposed through open
  directories, used Claude Code with 819 skills taken mostly from public
  GitHub repositories and no further orchestration. The actor tasked Claude
  Code to compromise a target and relied on the skills to guide the intrusion;
  in the observed activity the actor periodically had to intervene to get past
  the model's safety guardrails or to push it to keep working against a
  barrier. CrowdStrike states that despite a limited grasp of security
  fundamentals the actor used Claude Code to compromise several Indonesian
  government domains, a government domain of another country, and several
  private-sector entities. The activity falls in the May to August 2026
  window CrowdStrike documented. No victim is named.
date_disclosed: 2026-10-21 # CrowdStrike blog date.
status: reported # Single vendor; the only other coverage found (CXOtoday) reprints the blog verbatim.
confidence: primary # CrowdStrike analysed the actor's exposed framework directly.
category: ai-orchestrated-campaign
severity: medium # Several government domains and private-sector entities compromised; CrowdStrike's public text states no data theft for this actor.
models: [] # CrowdStrike blog names Claude Code but no model version.
model_families:
  - claude
actor: "Unnamed Indonesian-speaking actor (CrowdStrike 'Threat Actor 3'; no group named)"
actor_type: unknown # CrowdStrike blog says "actor" without stating whether one person or a group, or motive.
autonomy_pct: null
# Claude Code was tasked with whole intrusions, but the actor intervened
# periodically to push it past guardrails and barriers (CrowdStrike blog).
autonomy_level: human-in-the-loop
guardrail_bypass:
  - jailbreak # Actor intervened "to overcome the model's safety guardrails" (CrowdStrike blog); method not described.
ai_role: significant # Claude Code carried out the intrusions, with operator intervention to keep it going.
