  - crowdstrike-chinese-speaking-claude-proxy-harness-intrusions # One of four actors in the same CrowdStrike 2026-10-21 report.
  - crowdstrike-russian-speaking-claude-code-crm-exfiltration # One of four actors in the same CrowdStrike 2026-10-21 report.
