mitigations:
  - "General Analysis recommends scoping the MCP server to one project, using read-only access where writes aren't needed, keeping sensitive data out of reach, requiring manual review of tool calls and outputs that leave the workspace, treating retrieved content as data not instructions, and not relying on prompt-injection filters alone."
