id: supabase-mcp-database-leak
name: "Supabase MCP server could be steered into exposing a private database table"
summary: >-
  General Analysis published on 2025-07-08 a demonstration that an AI assistant
  connected through the Supabase MCP server, running with a privileged database
  role, could be steered by instructions hidden in customer support-ticket
  content into reading a private table of integration credentials and writing
  them into a ticket thread visible to the customer. The test used a self-built
  project with dummy data and reports no in-the-wild exploitation; the article
  notes that even read-only access permits reads of data available to the
  database role. Supabase documents the prompt-injection pattern and offers
  configuration options; the post does not report a Supabase fix. It is
  catalogued as an agent-hijack prompt-injection product vulnerability.
date_disclosed: 2025-07-08
status: reported # Single vendor/research publisher; proof-of-concept.
confidence: primary # First-hand researcher analysis.
category: agent-hijack-prompt-injection
severity: medium # Private credential table could be exposed; demonstrated on dummy data only.
models: []
