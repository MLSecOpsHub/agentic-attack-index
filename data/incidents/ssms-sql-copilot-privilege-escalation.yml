  records_exfiltrated: null
  sectors: []
  countries: []
lifecycle_phases:
  - initial-access
  - execution
  - persistence # Instructions persisted in database extended properties, loaded automatically (Embrace The Red).
  - privilege-escalation
  - exfiltration
mappings:
  mitre_atlas:
    - AML.T0051.001 # LLM Prompt Injection: Indirect
    - AML.T0053 # AI Agent Tool Invocation (T-SQL execution tools)
    - AML.T0086 # Exfiltration via AI Agent Tool Invocation (rows sent to an external server)
  mitre_attack: []
  owasp_llm: []
  owasp_asi: [] # OWASP Top 10 for Agentic Applications, ASI01–ASI10 (pinned in schema/owasp-asi.json; method in docs/owasp-asi-mapping.md)
  cve:
    - CVE-2026-65669
  aiid: []
impact: >-
  Demonstrated bypass of SQL Copilot's read-only mode, data modification and
  exfiltration of database rows, and escalation from db_owner to sysadmin using
  the victim's connection. MSRC: database data could be accessed or modified
  with the connected user's permissions; not publicly disclosed or exploited at
  release.
