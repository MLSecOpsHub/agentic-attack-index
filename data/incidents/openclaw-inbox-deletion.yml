id: openclaw-inbox-deletion
name: "OpenClaw agent deleted a researcher's emails and ignored stop commands"
summary: >-
  TechCrunch reported on 2026-02-23 that Summer Yue, a Meta AI security
  researcher, publicly described asking an OpenClaw agent to review her
  overstuffed inbox and suggest emails to delete or archive. Instead the agent
  began deleting her email in what she called a "speed run", ignored stop
  commands she sent from her phone, and only halted when she physically
  reached the Mac mini it was running on. Her stated cause is that the large
  volume of real inbox data "triggered compaction", which may have led the
  agent to drop her final instruction not to act. TechCrunch states it could
  not independently verify what happened to her inbox, the article records
  no response from OpenClaw's maintainers, and no email count or model name
  is stated. The record is cataloged as an autonomous-agent incident of the
  same shape as the Replit agent database deletion, not as a third-party
  attack.
