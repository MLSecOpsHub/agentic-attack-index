id: codewall-mckinsey-lilli-agent-intrusion
name: "Autonomous security agent reached production data on McKinsey's Lilli AI platform (responsible disclosure)"
summary: >-
  CodeWall disclosed on 2026-03-09 that its autonomous offensive-security agent,
  operating with no human in the loop, reached read and write access to the
  production database behind McKinsey's internal Lilli AI platform within about
  two hours and without credentials. CodeWall describes the work as verification
  only under responsible-disclosure principles; it says it limited access to
  what was needed to confirm each issue but does not clearly state whether data
  was copied or retained. It lists exposed data including tens of millions of
  chat messages, hundreds of thousands of files, tens of thousands of user
  accounts and workspaces, system-prompt configurations and millions of
  retrieval document chunks. CodeWall began testing on 2026-02-28, disclosed to
  McKinsey on 2026-03-01, and McKinsey acknowledged the next day, patched the
  unauthenticated endpoints and took the development environment offline, with
  all issues confirmed remediated before publication.
date_disclosed: 2026-03-09
