id: grok-bankr-prompt-injection-wallet-drain
name: "Prompt injection of Grok drained a Grok-linked crypto wallet via the Bankr trading agent"
summary: >-
  In early May 2026 an unnamed X user reportedly used a prompt-injection
  message that xAI's Grok processed, causing the Bankr trading agent connected
  to a Grok-linked cryptocurrency wallet to transfer about 3 billion DRB
  tokens, reported as worth roughly US$150,000 to 200,000, which were then
  liquidated. Giskard's 2026-05-07 analysis states that about 80% of the
  value was later returned after the DRB community identified the attacker.
  The OECD.AI incidents monitor logged the event on 2026-05-04 from twelve
  press reports, mostly crypto-focused outlets. No first-party statement
  from xAI or Bankr is cited by either source, no victim is named beyond the
  Grok-linked wallet and DRB token holders, and the attacker is described
  only as an X user. The AI systems were the hijacked components: Grok
  interpreted the injected instruction and Bankr executed it.
date_disclosed: 2026-05-04 # OECD.AI monitor entry date; press coverage began in early May 2026.
status: reported # Press-sourced; no first-party statement from xAI or Bankr.
confidence: secondary
