id: secflow-asia-government-education-campaign
name: "SecFlow framework drove commercial AI models against government and education systems across Asia"
summary: >-
  Hunt.io reported on 2026-09-03 that a Chinese-speaking operator used an
  orchestration framework it calls SecFlow, which assigns short objectives to
  specialist AI workers and can switch between Claude, Qwen and DeepSeek
  profiles without changing the task interface, to run a campaign against
  government, education, consular, healthcare and industrial targets across six
  countries between mid-May and early August 2026. Hunt.io characterises the AI
  as a coordination and workflow layer while conventional scripts, public
  proof-of-concept code and leaked credentials carried out exploitation. Named
  or identifiable targets include a Taiwanese party-history archive, a
  Southeast Asian ministry of foreign affairs, a mainland-Chinese district
  government environment and a university campus-card system; outcome-level
  impact includes command execution and credential collection on a district
  government environment, access to a Chinese education AI platform's data, and
  root database and admin access to a campus-card environment. Hunt.io does not
  state whether the operator is state-sponsored or criminal, and notes a shared
  AI context once carried an unsupported premise into later failed tasks.
