  # reconnaissance") contributed to ATT&CK/ATLAS, but no numeric IDs, so none recorded.
  mitre_attack: []
  owasp_asi: []
  cve: []
  aiid: []
impact: >-
  No novel or unique AI-enabled attack techniques were observed; Microsoft and
  OpenAI characterised the activity as consistent with using AI as a
  productivity tool. Identified accounts were terminated.
