id: microsoft-openai-state-actor-llm
name: "Microsoft/OpenAI disruption of state-affiliated actors misusing LLMs (2024)"
summary: >-
  On 2024-02-14 Microsoft Threat Intelligence and OpenAI jointly disclosed that
  they had detected and disrupted five state-affiliated threat actors using
  OpenAI's large language models to support cyber operations: Forest Blizzard
  (Russia), Emerald Sleet (North Korea), Crimson Sandstorm (Iran) and the
  China-affiliated Charcoal Typhoon and Salmon Typhoon. Reported uses included
  reconnaissance, scripting help, vulnerability research and social-engineering
  content. Both companies stated the activity amounted to productivity support
  rather than novel AI-enabled attack techniques, and OpenAI terminated the
  associated accounts.
date_disclosed: 2024-02-14
status: confirmed
confidence: primary
category: infrastructure-abuse-supply-chain
severity: medium # Reported as productivity/support use; no novel attack capability observed.
models:
  - GPT-4
model_families:
  - openai-gpt
actor: "Five state-affiliated actors: Forest Blizzard, Emerald Sleet, Crimson Sandstorm, Charcoal Typhoon, Salmon Typhoon"
actor_type: nation-state
autonomy_pct: null
autonomy_level: tool-assisted
guardrail_bypass:
