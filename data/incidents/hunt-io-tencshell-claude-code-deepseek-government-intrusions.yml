id: hunt-io-tencshell-claude-code-deepseek-government-intrusions
name: "Suspected China-based operators paired DeepSeek reasoning with Claude Code execution against Afghan and Thai government systems and Taiwanese firms"
summary: >-
  Hunt.io reported on 2026-07-14 a campaign it found by pivoting from known
  TencShell command-and-control infrastructure to an exposed open directory
  on a Hong Kong-hosted server holding victim source code, exploit scripts,
  operator logs and cloned login pages, with notes in Simplified Chinese.
  The recovered material shows a split-model workflow: DeepSeek-v4-pro
  handled reasoning, attack logic, script generation and decisions, while
  Claude Code handled execution, agentic tool use, session persistence and
  task parallelisation, reworking exploits after failed attempts and
  iterating phishing pages across targets. Per Hunt.io, the operators
  achieved remote code execution on an Afghan government web application,
  gained administrative access to a Thai government administrative system,
  exploited two of eight reconnoitred Taiwanese supply-chain and
  manufacturing organisations (a chemical manufacturer and a telecom and
  edge-device maker), targeted financial-services platforms in Europe,
  Australia and Asia, and staged reconnaissance and phishing pages against
  US government bodies without confirmed intrusion. Hunt.io notified
  affected organisations and national CERTs on 2026-07-06. It stops short of
  naming a group, describing the indicators as consistent with China-based
  activity; Deepwatch, relaying Hunt.io, calls the operators suspected
  Chinese state-sponsored.
# Distinct from existing Hunt.io records: thailand-mof-hermes-agent-intrusion
# (2026-07-23, Hermes agent, Thai Ministry of Finance, Hades implant) and
# secflow-asia-government-education-campaign (2026-09-03, SecFlow orchestrator).
# This report (URL chinese-operators-claude-deepseek-government-intrusion) covers
# TencShell/Gshell C2, a DeepSeek-v4-pro + Claude Code split, and Afghan, Thai and
# Taiwanese victims; Hunt.io does not mention Hermes or link it to either report.
# Also not dream-multi-agent-asia-government-campaign (Dream Research Labs, Taiwan).
# Victim naming: Hunt.io names neither the Afghan nor the Thai government system.
date_disclosed: 2026-07-14 # Hunt.io article body: "Published on Jul 14, 2026"; page metadata shows 2026-10-20 (later republication/edit). Deepwatch's 2026-07-16 advisory citing the report confirms the July date.
status: reported # Single discoverer (Hunt.io); Deepwatch relays it. No victim confirmation.
confidence: primary # Hunt.io analysed the operators' exposed directory and LLM session material directly.
category: ai-orchestrated-campaign
severity: high # Government employee and citizen data, source code and credentials taken across multiple organisations.
models:
  - "DeepSeek-v4-pro" # Reasoning model, per Hunt.io and Deepwatch.
  - "Claude Code 2.1.165" # Execution harness, per Hunt.io and Deepwatch. No source says which model Claude Code called.
model_families:
  - deepseek
  - claude
actor: "Unknown (Hunt.io: indicators 'consistent with China-based threat actor activity', no group named; Deepwatch: 'suspected Chinese state-sponsored operators')"
actor_type: unknown # Hunt.io stops short of naming a group or sponsor; Deepwatch's state-sponsored framing is derivative and hedged as suspected.
autonomy_pct: null
autonomy_level: human-in-the-loop # Hunt.io describes models "wired into the workflow" of multiple operators working independently; no unattended operation is described.
guardrail_bypass:
  - legitimate-tool-abuse # Commercial coding agent used as the execution layer.
  - open-weight-model # DeepSeek reasoning model.
ai_role: significant # Models drove reasoning and execution per Hunt.io, under operator direction alongside conventional implants and C2.
related:
  - thailand-mof-hermes-agent-intrusion # Same discoverer and a Thai government target; separate operation and tooling, no link stated.
  - secflow-asia-government-education-campaign # Same discoverer, Chinese-speaking operator, Claude and DeepSeek; separate operation, no link stated.
mitigations:
  - "Deepwatch recommends short-lived tokens, role-based access and phishing-resistant MFA on external admin portals, and blocking or alerting on traffic to the Hong Kong networks identified where business needs allow."
  - "Deepwatch suggests detecting agentic activity by watching for web or database processes that spawn shells performing rapid enumeration and credential hunting."
  - "Hunt.io notified affected organisations and national CERTs on 2026-07-06 and held publication for seven days."
targets:
  orgs_affected: null # Hunt.io gives no total: one Afghan and one Thai government system, two of eight Taiwanese firms exploited, and a payment platform.
  records_exfiltrated: null
  sectors:
    - government
    - chemical-manufacturing # Taiwanese chemical manufacturer, per Hunt.io.
    - telecommunications # Taiwanese telecom and edge-device maker, per Hunt.io.
    - financial-services # Billing and payment platforms, per Hunt.io.
  countries:
    - AF
    - TH
    - TW
    # US: reconnaissance and phishing-page staging only, no confirmed intrusion (Hunt.io); not listed.
lifecycle_phases:
  - recon # Scanning of 5,890+ government hosts across 10 countries, per Hunt.io.
  - resource-dev # Cloned login pages and C2 infrastructure.
  - initial-access
  - execution
  - credential-access # Database credentials, encryption keys and hardcoded cloud keys taken.
  - exfiltration
  - deception-social-eng # Phishing pages iterated by Claude Code.
mappings:
  mitre_atlas:
    - AML.T0016.002 # Obtain Capabilities: Generative AI
    - AML.T0102 # Generate Malicious Commands (DeepSeek generated scripts; Claude Code ran commands, per Hunt.io/Deepwatch)
  mitre_atlas_case_studies: []
  mitre_attack: []
  owasp_llm: []
  owasp_asi: [] # OWASP Top 10 for Agentic Applications, ASI01–ASI10 (pinned in schema/owasp-asi.json; method in docs/owasp-asi-mapping.md)
  cve: []
  aiid: []
impact: >-
  Per Hunt.io: names, national ID numbers and positions of Thai government
  employees; citizen complaint submissions, source code, encryption keys and
  database credentials from an Afghan government application; development
  source code and database information from a Taiwanese chemical
  manufacturer; cloud service account access at a Taiwanese telecom firm via
  hardcoded keys; and administrator account data from a payment processing
  platform.
