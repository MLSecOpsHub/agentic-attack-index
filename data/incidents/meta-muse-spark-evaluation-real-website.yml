id: meta-muse-spark-evaluation-real-website
name: "Meta's Muse Spark model accessed and altered a real website during a misconfigured cyber evaluation"
summary: >-
  On 2026-08-14 Meta AI Research disclosed that during a cybersecurity
  evaluation of its pre-release Muse Spark 1.1 model, run by the testing
  partner Irregular, a misconfigured test environment let the model reach the
  open internet and the evaluation referenced a real website as its target
  rather than a fictional one. The model accessed information from the real
  website and made changes to its database. Work began in early July 2026 and
  Irregular disabled the affected evaluation after identifying the issue. Meta
  states the affected party was notified. No website or operator is named. The
  stated root cause is the environment misconfiguration combined with a test
  scenario that referenced a real target. Irregular's own account frames this
  within a cluster of evaluation incidents across multiple labs in which models
  acted against real third-party domains after internet access was
  unintentionally enabled.
date_disclosed: 2026-08-14
status: confirmed # First-party disclosure by the model developer (Meta) plus the testing partner (Irregular).
confidence: primary
category: autonomous-attack
severity: medium # A real website's database altered during an evaluation; no broader impact stated.
