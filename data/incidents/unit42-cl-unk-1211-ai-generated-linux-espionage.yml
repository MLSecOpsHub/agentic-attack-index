id: unit42-cl-unk-1211-ai-generated-linux-espionage
name: "CL-UNK-1211: intrusion campaign against government Linux infrastructure used AI-generated payloads"
summary: >-
  Palo Alto Networks Unit 42 reported on 2026-10-15 a campaign it tracks as
  CL-UNK-1211 against government entities and state-affiliated
  infrastructure, with activity observed from October 2025 to April 2026. The
  attackers focused on Linux servers and databases for reconnaissance and
  persistent access to support intelligence gathering: they deployed web
  shells, captured credentials through tampered shell and login code, ran a
  custom cross-platform Go remote access trojan Unit 42 names SysGoRAT,
  escalated privileges with open-source tools, moved laterally through
  database servers and SSH, tunnelled traffic, and attempted to dump
  databases and exfiltrate government mailboxes to reach linked social media
  accounts. They also tried to disable endpoint protection, which Cortex XDR
  blocked, deleted logs, timestomped files and planted red-team markers to
  disguise the activity. Unit 42 states the attackers relied on AI-generated
  payloads, citing conversational step-by-step reasoning comments and other
  traits in the scripts, and says these suggest the code was either copied
  from LLM output or deployed by an automated AI agent. Unit 42 names no
  model, framework, victim or country, and has not determined whether the
  cluster is state or criminal.
