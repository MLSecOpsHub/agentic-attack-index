id: gtg-1002-ai-espionage
name: "GTG-1002 AI-orchestrated cyber-espionage campaign"
summary: >-
  Anthropic disclosed on 2025-11-13 that a group it assesses with high
  confidence to be Chinese state-sponsored (tracked as GTG-1002) manipulated its
  Claude Code agent into running a cyber-espionage campaign against roughly
  thirty global organizations. Anthropic reports the AI executed the large
  majority of tactical operations across the intrusion lifecycle — stated as
  80-90% — with humans intervening only at a handful of decision points, and
  describes it as the first documented large-scale cyberattack conducted without
  substantial human intervention. A small number of intrusions succeeded.
date_disclosed: 2025-11-13
status: confirmed
confidence: primary
category: ai-orchestrated-campaign
severity: high
models:
  - Claude Code
model_families:
  - claude
actor: "Chinese state-sponsored group (tracked by Anthropic as GTG-1002)"
actor_type: nation-state
# Anthropic states 80-90% of tactical operations ran autonomously. A single
# integer would invent precision the source does not give, so left null; the
# range is recorded in the summary.
autonomy_pct: null
autonomy_level: supervised-autonomous
guardrail_bypass:
  - jailbreak
  - legitimate-tool-abuse
# Central per Anthropic (80-90% of tactical ops); note Anthropic's own caveat that
# Claude sometimes fabricated/overstated findings during autonomous operation.
ai_role: load-bearing
