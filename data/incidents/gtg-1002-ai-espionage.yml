id: gtg-1002-ai-espionage
name: "GTG-1002 AI-orchestrated cyber-espionage campaign"
summary: >-
  Anthropic disclosed on 2025-11-13 that a group it assesses with high
  confidence to be Chinese state-sponsored (tracked as GTG-1002) manipulated its
  Claude Code agent into running a cyber-espionage campaign against roughly
  thirty global organizations. Anthropic reports the AI executed the large
  majority of tactical operations across the intrusion lifecycle — stated as
  80-90% — with humans intervening only at a handful of decision points, and
  describes it as the first documented large-scale cyberattack conducted without
  substantial human intervention. A small number of intrusions succeeded.
date_disclosed: 2025-11-13
status: confirmed
confidence: primary
category: ai-orchestrated-campaign
severity: high
models:
  - Claude Code
model_families:
  - claude
actor: "Chinese state-sponsored group (tracked by Anthropic as GTG-1002)"
actor_type: nation-state
# Anthropic states 80-90% of tactical operations ran autonomously. A single
# integer would invent precision the source does not give, so left null; the
# range is recorded in the summary.
autonomy_pct: null
autonomy_level: supervised-autonomous
guardrail_bypass:
  - jailbreak
  - legitimate-tool-abuse
# Central per Anthropic (80-90% of tactical ops); note Anthropic's own caveat that
# Claude sometimes fabricated/overstated findings during autonomous operation.
ai_role: load-bearing
related: []
mitigations: []
targets:
  orgs_affected: 30 # "roughly thirty global targets"; a small number were breached.
  records_exfiltrated: null
  sectors:
    - technology
    - financial-services
    - chemical-manufacturing
    - government
  countries: [] # "global targets"; no specific target country named.
geo:
  points:
    # Anthropic: "we assess with high confidence was a Chinese state-sponsored
    # group". Sponsorship, not operator location — no location is stated.
    - role: origin
      basis: sponsor-attribution
      attributed_by: "Anthropic"
      country: CN
      lat: 35.86
      lng: 104.19
      label: "China (state sponsor, per Anthropic)"
      illustrative: true # Country centroid.
lifecycle_phases:
  - recon
  - resource-dev
  - initial-access
  - execution
  - credential-access
  - exfiltration
mappings:
  mitre_atlas:
    # AML.T0053 AI Agent Tool Invocation was removed on 2026-10-16: it describes using a victim's or hijacked agent, and this was the actor's own agent, which AML.CS0069 maps as AML.T0103.
    - AML.T0016.002 # Obtain Capabilities: Generative AI
    - AML.T0017.001 # Develop Capabilities: Autonomous Exploit Development
    - AML.T0025 # Exfiltration via Cyber Means
    - AML.T0040 # AI Model Inference API Access
    - AML.T0051.000 # LLM Prompt Injection: Direct
    - AML.T0054 # LLM Jailbreak
    - AML.T0075 # Enterprise Resource Discovery
    - AML.T0089 # Enterprise Environment Discovery
    - AML.T0102 # Generate Malicious Commands
    - AML.T0103 # Deploy AI Agent
    - AML.T0116 # Autonomous Reconnaissance
    - AML.T0117 # Autonomous Attack-Path Adaptation
  mitre_atlas_case_studies:
    - AML.CS0069 # ATLAS case study "GTG-1002 Claude Code Espionage Campaign" (ATLAS v2026.09).
  mitre_attack: [] # Anthropic published no ATT&CK IDs in the disclosure.
  owasp_asi: []
  cve: []
  aiid: []
impact: >-
  Attempted infiltration of ~30 organizations with a small number of successful
  intrusions, including credential harvesting and data extraction, per Anthropic.
