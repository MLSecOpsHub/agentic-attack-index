id: crowdstrike-argentina-healthcare-claude-code-harness
name: "Operator ran a PentestGPT-derived Claude Code harness against Argentine healthcare organizations, exfiltrating medical records"
summary: >-
  CrowdStrike Counter Adversary Operations reported on 2026-10-21 that a
  Spanish/English-speaking operator, one of four previously unreported actors
  whose offensive agent frameworks were exposed through open directories, ran
  a purpose-built autonomous penetration-testing harness against Argentine
  healthcare organizations. The harness uses a dual-agent design in which a
  Supervisor Claude Code agent picks the next task from a predefined workflow
  of attack stages and an Executor agent performs it; CrowdStrike says it is
  derived from the open-source PentestGPT project and rebuilt with additional
  MCP servers, exploitation scripts and skills. CrowdStrike states the
  operator compromised at least 15 Argentina-based healthcare entities and
  exfiltrated credentials and medical records from at least one. The activity
  falls in the May to August 2026 window CrowdStrike documented. CrowdStrike
  names no victim, and its report page states that all four actors overcame
  commercial AI safety controls without saying how in the public text.
date_disclosed: 2026-10-21 # CrowdStrike blog date.
status: reported # Single vendor; the only other coverage found (CXOtoday) reprints the blog verbatim.
confidence: primary # CrowdStrike analysed the actor's exposed framework directly.
category: ai-orchestrated-campaign
severity: high # At least 15 healthcare entities compromised; credentials and medical records exfiltrated from at least one (CrowdStrike blog).
models: [] # CrowdStrike blog names Claude Code as the agent but no model version.
model_families:
  - claude # "Supervisor" Claude Code agent (CrowdStrike blog).
actor: "Unnamed Spanish/English-speaking operator (CrowdStrike 'Threat Actor 1'; no group named)"
actor_type: single-operator # CrowdStrike blog: "A Spanish/English-speaking operator".
autonomy_pct: null
# CrowdStrike describes an "autonomous" harness in which the Supervisor agent
# selects tasks from a predefined state machine; the operator built the
# workflow and chose the target sector.
autonomy_level: supervised-autonomous
guardrail_bypass:
  - unknown # CrowdStrike report page: all four actors overcame commercial AI safety controls; mechanism for this actor not stated publicly.
ai_role: load-bearing # CrowdStrike: agents select and execute attack stages; the compromises are attributed to the harness.
