      basis: victim-location
      attributed_by: "OpenAI"
      country: AU
      lat: -25.27
      lng: 133.78
      label: "Australia (NSW and Victorian state agencies and AIHW, per OpenAI)"
      illustrative: true # Country centroid; lab-test-eval records carry target points only.
lifecycle_phases:
  - recon
  - initial-access # Exposed access key used against VAHI; crafted queries against the NPWS service.
  - credential-access # Exposed VAHI access key; browser API credentials supplied by the BOCSAR tool.
mappings:
  mitre_atlas: []
  mitre_attack: []
  owasp_llm: []
  owasp_asi: []
  cve: []
  aiid: []
impact: >-
  Per OpenAI: BOCSAR's system returned application configuration, operational
  jobs and logs, and website metadata; VAHI reporting configuration and
  aggregate survey statistics were retrieved with an exposed access key; NPWS
  database metadata not intended to be public was inferred and the public Fire
  History dataset downloaded; AIHW material retrieved appears to have been
  public, with bypass attempts failing. No individual crime, medical or
  personal records were accessed. BOCSAR assessed the risk as low; AIHW and
  ASD found no evidence of compromise; the NSW government found no
  unauthorised access to personal information.
