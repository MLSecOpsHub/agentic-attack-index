id: gtig-ai-developed-zero-day-2fa-bypass
name: "GTIG: criminal actor's AI-developed zero-day exploit against a web-based system administration tool"
summary: >-
  In its May 2026 AI Threat Tracker, Google Threat Intelligence Group (GTIG)
  reported what it calls its first identified case of a threat actor using a
  zero-day exploit that GTIG believes was developed with AI. The exploit
  targeted a popular open-source, web-based system administration tool and was
  held by a criminal threat actor that GTIG says was partnering with a
  prominent cybercrime actor to plan a mass exploitation operation. GTIG
  assesses with high confidence that an AI model was used in discovery and
  weaponization, basing that on indirect indicators in the exploit code
  rather than direct evidence of the tool, and states it does not believe
  Gemini was used. No model, actor name, victim, country or CVE is given. GTIG
  worked with the unnamed vendor on responsible disclosure and states its
  counter-discovery "may have prevented" the planned mass exploitation.
date_disclosed: 2026-05-12
status: reported # Single vendor report; the AI-development claim rests on GTIG's assessment of indirect indicators.
confidence: primary # Vendor threat-intelligence report with direct visibility into the exploit.
category: ai-orchestrated-campaign
severity: medium # A planned mass exploitation that GTIG says may have been prevented; no confirmed victims.
models: [] # GTIG names no model and states it does not believe Gemini was used.
model_families:
  - other
actor: "Unknown criminal threat actor (unnamed by GTIG), in partnership with a prominent cybercrime actor"
actor_type: cybercriminal
autonomy_pct: null
autonomy_level: tool-assisted # AI used in vulnerability discovery and exploit development; the operation itself was human-run.
guardrail_bypass:
