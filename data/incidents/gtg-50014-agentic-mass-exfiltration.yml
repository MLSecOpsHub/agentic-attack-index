id: gtg-50014-agentic-mass-exfiltration
name: "GTG-50014 ShinyHunters-linked agentic mass data theft and extortion"
summary: >-
  In its September 2026 report "Countering misuse of AI", Anthropic disclosed a
  financially motivated cluster it tracks as GTG-50014, whose operators it
  describes as "suspected to be affiliates of the ShinyHunters collective".
  Between December 2025 and August 2026 the affiliates used Claude across
  multiple intrusions: a technology provider lost more than a terabyte of data
  including hundreds of thousands of national identifiers and millions of
  payment card records; an airline lost tens of millions of passenger records;
  an energy company, a French retail chain, a Web3 identity platform, a
  nonprofit and an enterprise software company were also hit; and a SaaS
  provider compromise reached roughly 200 downstream customer organizations.
  Over 2,100 Azure AD token sets spanning more than 40 corporate tenants were
  harvested in about 34 hours. Anthropic states that for the SaaS session-store
  dump "AI agents performed nearly all of the work", with humans setting
  targets and reviewing exfiltration. Anthropic detected and banned the
  associated accounts and engaged authorities, industry partners and victims.
