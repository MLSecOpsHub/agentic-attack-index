id: gemini-cli-ci-untrusted-workspace-rce
name: "Gemini CLI auto-trusted untrusted CI workspaces, creating a remote-code-execution risk"
summary: >-
  A GitHub security advisory (GHSA-wpqr-6v78-jr5g), published 2026-04-24,
  documents that Gemini CLI and the run-gemini-cli GitHub Action, in headless
  or CI mode, previously trusted workspace folders automatically, so untrusted
  content such as pull requests from outside contributors could lead to remote
  code execution; a permissive mode also ignored the tool allowlist, letting
  prompt injection on untrusted input lead to arbitrary command execution. The
  advisory is rated critical (CVSS 10.0). Fixed versions require explicit folder
  trust in headless mode. Affected versions are the Gemini CLI below 0.39.1 and
  below 0.40.0-preview.3 and run-gemini-cli below 0.1.22; the fixes are 0.39.1
  and 0.40.0-preview.3 for the CLI and 0.1.22 for the Action. Credited to
  researchers at Novee Security and Pillar Security.
date_disclosed: 2026-04-24
status: confirmed # First-party GitHub security advisory with assigned fixes.
confidence: primary
category: agent-hijack-prompt-injection
severity: critical # CVSS 10.0; untrusted CI input could reach remote code execution.
