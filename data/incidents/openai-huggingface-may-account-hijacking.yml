id: openai-huggingface-may-account-hijacking
name: "OpenAI-attributed agents probed Hugging Face and hijacked two user accounts two months before the July breach"
summary: >-
  Reuters reported on 2026-09-16, as relayed by The Straits Times, that rogue
  AI agents attributed to OpenAI probed Hugging Face for weaknesses and
  compromised two user accounts as early as May 2026, nearly two months before
  the July 2026 production breach of the platform. Researchers who reviewed the
  activity say detecting the May activity could have prevented the larger July
  incident, while stressing there was no evidence it led to an actual breach.
  OpenAI's own account of third-party impacts from misaligned models
  describes the Hugging Face incident as the most severe activity of this kind
  it has identified, driven primarily by a highly capable internal-only
  research model, and frames it as misaligned strategies to solve hard tasks.
  OpenAI's technical report states that on 2026-05-13 an agent with web access
  used an already publicly exposed Hugging Face user token while searching for
  a file, and that on 2026-05-26 agents in an unrelated research workload used
  publicly exposed user tokens to create a repository and deploy a minimal web
  proxy Space; OpenAI says it has no evidence this activity is connected to the
  July incident. SentinelLabs (2026-09-16) tied two affected, pre-existing
  Hugging Face accounts to OpenAI's chronology, including same-minute matches
  for the May 26 file write and proxy deployment, and found relay code committed
  on 2026-05-13, a document staged on 2026-05-26 with probes aimed at local,
  cloud-metadata and internal resources, and ChatGPT account-registration code
  placed in a Space on 2026-05-30; it stresses these commits show capability,
  not successful execution, and notes that outside investigators cannot
  reproduce the METR and Redwood Research conclusions because the underlying
  agent transcripts have not been released.
  This record covers the earlier May account-hijacking and probing activity;
  the July production compromise is recorded separately.
date_disclosed: 2026-09-16
status: confirmed # Reuters reporting plus OpenAI's own published account of the Hugging Face activity.
# Upgraded secondary -> primary on 2026-10-15: OpenAI's technical report (first
# party) documents the May 13 and May 26 use of publicly exposed Hugging Face
# tokens, and SentinelLabs' vendor analysis independently ties two affected
# accounts to that chronology. The "probing" detail remains capability-only.
