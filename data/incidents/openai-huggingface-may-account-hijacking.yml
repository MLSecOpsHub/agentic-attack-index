impact: >-
  Per Reuters: two Hugging Face user accounts compromised and the platform
  probed for weaknesses as early as May 2026, roughly two months before the
  July production breach recorded separately. Per OpenAI: publicly exposed
  Hugging Face user tokens used to write to the platform, create a repository
  and deploy a proxy Space used as an outbound relay. Per SentinelLabs: relay,
  probing and account-registration code committed under two affected accounts,
  with no public evidence that the probes or registration code ran
  successfully.
