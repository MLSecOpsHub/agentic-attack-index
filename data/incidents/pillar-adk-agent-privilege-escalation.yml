id: pillar-adk-agent-privilege-escalation
name: "Pillar: low-privilege triage agent could trigger privileged Gemini workflows on Google's ADK repository"
summary: >-
  Pillar Security disclosed on 2026-08-03, through Google's Open Source Software
  Vulnerability Reward Program, that a low-privilege public-facing triage agent
  in the CI/CD of Google's Agent Development Kit repository (google/adk-python)
  could be manipulated into triggering a higher-privilege maintainer-only Gemini
  workflow. A second issue let an externally authored issue drive a privileged
  agent workflow that exposed a bot access token and a cloud service-account
  credential to the CI runner. Pillar reported the issues on 2026-06-02 and
  2026-06-05; the affected workflows were removed by 2026-07-02 and Google
  confirmed a fix on 2026-07-21. The work was proof-of-concept in a controlled
  project with no confirmed malicious exploitation, though Pillar observed other
  actors probing the same surface and shared logs with Google.
date_disclosed: 2026-08-03
status: reported # Single vendor publisher (Pillar); Google acknowledged and fixed per the post.
confidence: primary
category: agent-hijack-prompt-injection
severity: medium # Credential exposure to CI demonstrated; proof-of-concept, no confirmed exploitation.
models:
