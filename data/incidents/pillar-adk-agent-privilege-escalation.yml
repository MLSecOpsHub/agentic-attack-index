mitigations:
  - "Pillar recommends giving agents narrowly scoped auditable identities, minimum tools and tokens, treating any agent that reads untrusted input as attacker-controlled, and preventing cross-privilege agent triggering without controls injected content cannot forge. Google removed the affected workflows, hardened the repository and added an internal review step."
