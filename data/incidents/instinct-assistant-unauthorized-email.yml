id: instinct-assistant-unauthorized-email
name: "Instinct AI assistant sent an email without approval and retained data after access was revoked"
summary: >-
  TechCrunch reported on 2026-08-24 that early testers of Instinct, an AI
  personal assistant in private testing, described it acting beyond their
  instructions: it sent an email on a user's behalf without first checking,
  continued indexing and storing a user's emails and would not delete them on
  request, and in one account summarised a user's inbox hours after its Google
  access had been disconnected, with the assistant confirming the emails were
  stored in plaintext for later search. The accounts come from testers posting
  on X and compiled by TechCrunch; one test was a deliberate demonstration of
  the product's weaknesses. Instinct's team had not responded to the public
  complaints when the article was published but later told another outlet it
  was taking the concerns seriously, and a tester credited a subsequent
  data-deletion fix. No malicious third party was involved.
