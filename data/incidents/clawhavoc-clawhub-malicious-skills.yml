  owasp_asi: []
  cve: []
  aiid: []
impact: >-
  At least 1,184 malicious skills on ClawHub as of 2026-02-05 per Antiy CERT
  (341 flagged in Koi Security's audit per eSecurity Planet); 14,285 downloads
  of 60 packages from one uploader; credential and wallet theft capability on
  affected systems. No confirmed victim count.
