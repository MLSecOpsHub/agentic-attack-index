impact: >-
  Per Wiz: over a thousand valid GitHub tokens, dozens of valid cloud
  credentials and NPM tokens, and roughly twenty thousand additional files
  leaked; a subsequent wave made over 5,500 private repositories public across
  400+ users and organisations. Malware also attempted host lockout via a
  shutdown command appended to shell startup files.
