id: dream-multi-agent-asia-government-campaign
name: "Multi-agent AI framework used to compromise government entities in Asia"
summary: >-
  On 2026-08-12 Dream Research Labs reported an exposed operator archive
  revealing a multi-agent framework, built on the Hermes and OpenClaw agents,
  that ran parallel sub-agents across 12 documented attack waves against
  government entities in Asia between 1 and 4 July 2026. Dream describes the
  system as near-autonomous, adapting mid-operation without human intervention
  and bypassing model safety refusals by framing its activity as authorized
  penetration testing; it attributes the operator to a Chinese-language actor
  on linguistic grounds and names no group. Claimed results include about 1,395
  files produced, 85 cracked employee accounts, more than 2,500 personnel
  records exfiltrated, a persistent foothold in state infrastructure and
  backdoors on government web applications. Taiwan's Ministry of Digital
  Affairs separately confirmed AI-agent attacks on government agencies in July,
  said affected units were handled, and stated the attacks showed clear signs
  of originating overseas. Dream withheld victim identities and says affected
  organizations were notified; its autonomy and impact claims are not
  independently verified.
date_disclosed: 2026-08-12
