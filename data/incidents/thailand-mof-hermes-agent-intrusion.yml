impact: >-
  Per Hunt.io: several systems within the Ministry of Finance network
  compromised, including a web shell on a ministry web server, captured
  session material for an administrative panel and a document-management
  platform, and agent-driven enumeration of a directory holding personnel
  records. No evidence of exfiltration; the ministry has not confirmed a
  breach.
