id: thailand-mof-hermes-agent-intrusion
name: "Operator ran a Hermes agent unattended for post-compromise enumeration inside Thailand's Ministry of Finance network"
summary: >-
  Hunt.io, in research conducted jointly with researcher Bob Diachenko,
  reported on 2026-07-23 an intrusion targeting Thailand's Ministry of Finance
  that it says was largely driven by the open-source Hermes agent running in
  its unattended "YOLO" mode, which removes human approval prompts. Three open
  directories on a Hong Kong-hosted staging server, captured between 9 and 13
  July 2026, held exploit code, web shells, tunnelling tools, scripts with
  hardcoded stolen credentials aimed at ministry mail and Hadoop
  infrastructure, a previously unreported Go implant the operator calls
  "Hades", and Hermes output logs. The logs show the agent, on the operator's
  instructions, running privilege-escalation and kernel-vulnerability
  assessments against a ministry host, enumerating services and binaries, and
  recursively searching a web directory of the Office of the Permanent
  Secretary that held personnel records dating back to 2012. Hunt.io says
  session material, a web shell deployed on a ministry web server and internal
  network access indicate several ministry systems were compromised, but it
  found no evidence the files were exfiltrated and could not determine how
  initial access was obtained; no recovered artifact shows Hades on a ministry
  machine. Most of the tooling was conventional and the exploited weaknesses
  (such as default Hadoop service credentials) are not AI-specific. The
  ministry has not publicly confirmed a breach. Hunt.io assesses with
  low-to-medium confidence that the operator is Chinese-speaking.
# Victim naming: Hunt.io's own report names Thailand's Ministry of Finance as the
# target; ThaiCERT and the NCSA were notified on 2026-07-15 and acknowledged
# receipt. The ministry itself has not confirmed a breach (BleepingComputer).
# Not a duplicate of secflow-asia-government-education-campaign (different
# Hunt.io report, infrastructure, models and targets; no Thailand) or of
# dream-multi-agent-asia-government-campaign (Taiwan, Dream Research Labs).
date_disclosed: 2026-07-23
status: reported # Single discoverer (Hunt.io with Diachenko); news coverage relays it and the ministry has not confirmed.
confidence: primary # Hunt.io analysed the operator's exposed staging directories and agent logs directly.
category: ai-orchestrated-campaign
severity: high # Government ministry; web shell deployed, session material captured and personnel records enumerated; no exfiltration evidenced.
models: [] # Hunt.io names the Hermes agent framework but not the underlying model.
model_families:
  - other # Hermes Agent (Nous Research) is an agent framework; the model it called is not named.
actor: "Unknown (Hunt.io: low-to-medium confidence the operator is Chinese-speaking; no group named)"
actor_type: unknown
autonomy_pct: null
autonomy_level: supervised-autonomous # Agent ran in unattended mode without approval prompts; the operator instructed its tasks.
guardrail_bypass:
  - legitimate-tool-abuse # Stock open-source agent run with its human-approval step disabled.
ai_role: significant # Hunt.io says the attack was "largely driven" by Hermes, but the logs cover post-compromise enumeration and most tooling was conventional.
related:
  - secflow-asia-government-education-campaign # Same discoverer (Hunt.io) and region; separate operation.
  - unit42-hermes-deepseek-autonomous-campaign # Same agent framework run by an operator; separate operation.
  - blackhatsect0r-hermes-dxscan-harvesting # Same technique: the open-source Hermes Agent run against real targets; no actor link stated.
  - carbonato-docker-hermes-botnet # Same technique: the open-source Hermes Agent run against real targets; no actor link stated.
mitigations:
  - "Hunt.io recommends reviewing the HiveServer2 authentication mode (the default accepts any credentials) and enforcing its UDF blocklist."
  - "Audit web roots for hidden PHP files named to imitate system caches, and alert on web server processes connecting to internal Hadoop service ports."
  - "Patch sudo and polkit, disable WebDAV on remaining IIS 6.0 servers, and change default credentials on GlassFish admin consoles while restricting them to trusted networks."
  - "Hunt.io notes exposed Hermes web panels and publicly browsable /hermes-results/ output directories can be found by banner and file-path searches."
