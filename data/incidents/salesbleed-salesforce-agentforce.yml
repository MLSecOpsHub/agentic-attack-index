  aiid: []
impact: >-
  Proof-of-concept exfiltration of CRM Accounts data (company names and deal
  sizes) from Salesforce Agentforce after an internal user's routine query, with
  no click on attacker content required. Zenity Labs states the reach extends to
  any data the subagent's tools can access. Remediated by Salesforce; no
  customer exploitation known per Salesforce.
