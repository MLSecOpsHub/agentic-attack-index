id: trendmicro-gemini-cli-dental-botnet
name: "Russian-speaking operator used Google Gemini CLI to build and run a command-and-control botnet"
summary: >-
  Trend Micro reported on 2026-07-14 that a Russian-speaking threat actor it
  tracks as "bandcampro" abused Google's Gemini CLI as the primary operational
  agent, consultant and interface to build, deploy and run a
  command-and-control botnet, with the operator supplying intent in natural
  language. Trend Micro states the AI handled server construction, deployment
  on a new virtual private server, infrastructure configuration, bot management
  and troubleshooting, and that it controlled eight computers at a dental
  clinic and accessed the clinic's practice database. Session logs cover 19
  March to 21 April 2026. The actor's related activity included credential
  attacks, compromised merchant websites and planning of cryptocurrency fraud
  targeting elderly people in the US and Canada; the dental clinic's country
  and the victims are not named. The Hacker News corroborated the report.
date_disclosed: 2026-07-14
status: confirmed # Vendor report plus independent corroboration by The Hacker News.
