# =============================================================================
# Incident record template — Agentic Attack Index
#
# Do not edit this file to add an incident. Instead run:
#   npm run new:incident -- <kebab-case-id> "Incident name"
# which copies this template to data/incidents/<id>.yml.
#
# Rules (see CLAUDE.md — non-negotiable):
#   * Every factual field must come from a cited, resolvable source.
#   * If a fact is not in a source: leave the field null/empty and add
#     "# TODO: source" — never guess, never invent.
#   * Defensive framing only: lifecycle-level description, no exploit code,
#     payloads, prompts, or step-by-step offensive instructions.
#   * Files starting with "_" are schema-validated but excluded from the
#     built dataset and from linkcheck.
#
# Validate with: npm run validate   (schema/incident.schema.json is authoritative)
# =============================================================================

# Stable kebab-case slug. Permanent — it is the citation key. Never rename.
id: template-incident

# Short human-readable name.
name: "TEMPLATE — replace with incident name"

# Lifecycle-level, defensive-framing summary. What happened, who disclosed it,
# what role the AI agent played. No operational detail.
summary: >-
  Placeholder summary. Replace with a source-backed, defensive-framing
  description of the incident at attack-lifecycle level.

# Date of first public disclosure (ISO 8601, YYYY-MM-DD).
date_disclosed: 2026-01-01

# confirmed | reported | test-eval    (see taxonomy/status.yml)
status: reported

# primary | secondary | unverified    (see taxonomy/confidence.yml)
# Never present a secondary/single-source claim as primary.
confidence: unverified

# ai-orchestrated-campaign | autonomous-attack | lab-escape-eval |
# agent-hijack-prompt-injection | infrastructure-abuse-supply-chain
# (see taxonomy/category.yml)
category: agent-hijack-prompt-injection

# critical | high | medium | low      (see taxonomy/severity.yml)
severity: low

# Specific model names exactly as sources state them. Empty list if unnamed.
models: []

# One or more of: claude | openai-gpt | openai-codex | gemini | deepseek |
# llama | mistral | hermes | other    (see taxonomy/model-family.yml)
model_families:
  - other

# Actor as stated by sources. "Unknown" is a valid value — do not attribute
# beyond what sources state.
actor: Unknown

# nation-state | cybercriminal | single-operator | lab-test-eval |
# researcher | unknown                (see taxonomy/actor-type.yml)
actor_type: unknown

# Integer 0–100 only if a source states an autonomy figure; otherwise null.
autonomy_pct: null

# Agentic autonomy level — qualitative class (see taxonomy/autonomy-level.yml):
# tool-assisted | human-in-the-loop | supervised-autonomous | fully-autonomous |
# not-applicable (AI is the victim, e.g. agent-hijack) | unknown
autonomy_level: unknown

# How the model's safety controls were bypassed (0+; taxonomy/guardrail-bypass.yml):
# jailbreak | open-weight-model | legitimate-tool-abuse |
# indirect-prompt-injection | none-observed | unknown
guardrail_bypass:
  - unknown

# Editorial skepticism axis — how central AI really was (taxonomy/ai-role.yml):
# load-bearing | significant | incidental | disputed | unknown
ai_role: unknown

# Ids of related records in this dataset (same report/campaign/actor/technique).
# Each must reference an existing record — enforced by `npm run validate`.
related: []

# Defensive measures or detections as stated by sources. Defensive framing only.
mitigations: []

targets:
  # Integers only if a source states them; otherwise null.
  orgs_affected: null
  records_exfiltrated: null
  # Target sectors. Free-text, but prefer an id from taxonomy/sector.yml
  # (validate warns on off-vocabulary values), e.g. ["financial-services"].
  sectors: []
  # ISO 3166-1 alpha-2 codes, e.g. ["US", "JP"].
  countries: []

geo:
  # Map point for the tracker. Set illustrative: true when the point is a
  # sector/region centroid rather than a precise, source-stated location.
  target:
    lat: 0
    lng: 0
    label: "Placeholder — replace or remove"
    illustrative: true
  # Same shape as target, or null when sources state no origin.
  origin: null

# Phases observed, per sources: recon | resource-dev | initial-access |
# execution | credential-access | privilege-escalation | persistence |
# exfiltration | deception-social-eng | impact  (see taxonomy/lifecycle-phase.yml)
lifecycle_phases: []

# External framework IDs exactly as published — never invent an ID.
# mitre_atlas preferred for AI-native techniques (e.g. AML.T0051);
# mitre_attack for traditional TTPs (e.g. T1566); aiid = AI Incident
# Database incident numbers (integers).
mappings:
  mitre_atlas: []
  mitre_attack: []
  owasp_llm: [] # OWASP Top 10 for LLM Apps, e.g. LLM01
  owasp_asi: [] # OWASP Agentic Security Initiative ids
  cve: []
  aiid: []

# Stated impact (financial, data, operational) only as sources describe it.
impact: null

# ≥1 source with a working URL is REQUIRED. type: first-party-disclosure |
# vendor-report | government-advisory | research-paper | news | blog | other
sources:
  - title: "Placeholder source — replace with the real disclosure"
    url: "https://example.com/replace-me"
    # Optional: a Wayback/archive snapshot so the record survives link rot.
    # archive_url: "https://web.archive.org/web/0/https://example.com/replace-me"
    publisher: "Example Publisher"
    type: other
    date: 2026-01-01

added:
  date: 2026-01-01
  by: "your-github-handle"

last_updated: 2026-01-01
