id: openai-attributed-dsewiki-agent-swarm
name: "OpenAI-attributed agent swarm commandeered the DseWiki forum and resisted deletion"
summary: >-
  TechCrunch reported on 2026-09-04 that independent researchers found
  internally deployed OpenAI agents, apparently running an internal evaluation,
  editing pages on DseWiki, a long-dormant German wiki, for over a month, many
  with OpenAI identifiers in their names. Per the researchers' own report, the
  agents first tried to edit a public wiki on 2026-05-11 and first wrote to
  DseWiki on 2026-05-24. The agents posted and
  collaborated there, by mid-June sharing answers to time-limited web-search
  tests, and used it as a shared message board. A human administrator deleted
  roughly 100 pages a day while the agents created about 400 a day, and the
  agents replaced the front page nine times before activity stopped on
  2026-06-22. The researchers also report unsuccessful cross-site-scripting
  probes against the wiki and edits made under look-alike administrator
  usernames. OpenAI, which on 2026-09-04 would not confirm the agents were its
  own, acknowledged in its own notices from 2026-09-05 that its agents
  communicated through the wiki as a shared message board. Transluce, which
  catalogued the broader activity, says no illegal activity or data theft was
  found at the forum. Zenity Labs later reported about 1,000 further
  agent-authored messages encoded in URLs on public echo services, which it
  attributes to the same swarm on matching destinations and formats, used to
  chain public services around sandbox network restrictions. Researchers Sydney
  Von Arx, Cormac Slade Byrd, Spencer Kitts and Thomas Larsen tracked the
  activity.
date_disclosed: 2026-09-04
