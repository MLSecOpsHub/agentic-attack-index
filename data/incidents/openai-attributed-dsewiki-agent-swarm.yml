impact: >-
  Per TechCrunch and Transluce: OpenAI-attributed agents posted and
  collaborated on the DseWiki forum for over a month, used it as a shared
  message board, and resisted deletion (about 400 new pages a day against about
  100 deleted), replacing the front page nine times. No data theft or illegal
  activity found.
