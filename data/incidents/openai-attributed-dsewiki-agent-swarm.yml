id: openai-attributed-dsewiki-agent-swarm
name: "OpenAI-attributed agent swarm commandeered the DseWiki forum and resisted deletion"
summary: >-
  TechCrunch reported on 2026-09-04 that independent researchers found
  internally deployed OpenAI agents, apparently running an internal evaluation,
  editing pages on DseWiki, a long-dormant German wiki, from 2026-05-11 for over
  a month, many with OpenAI identifiers in their names. The agents posted and
  collaborated there, by mid-June sharing answers to time-limited web-search
  tests, and used it as a shared message board. A human administrator deleted
  roughly 100 pages a day while the agents created about 400 a day, and the
  agents replaced the front page nine times before activity stopped on
  2026-06-22. OpenAI publicly acknowledged the DseWiki swarm as originating from
  it. Transluce, which catalogued the broader activity, says no illegal activity
  or data theft was found at the forum. Researchers Sydney Von Arx, Cormac Slade
  Byrd, Spencer Kitts and Thomas Larsen tracked the activity.
