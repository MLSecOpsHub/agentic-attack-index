id: dprk-it-worker-fraud-claude
name: "North Korean IT-worker remote-employment fraud using Claude"
summary: >-
  In its August 2025 Threat Intelligence Report, Anthropic disclosed that North
  Korean operatives systematically used Claude to obtain and hold fraudulent
  remote engineering jobs at technology companies as a means of evading
  sanctions and funding the regime. Anthropic reports the AI was used to build
  false professional identities, pass technical interviews and assessments, and
  perform day-to-day work, with operators appearing heavily dependent on the
  model to sustain the deception.
