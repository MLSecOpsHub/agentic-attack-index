lifecycle_phases:
  - recon
  - initial-access # Injection flaw used on a university server.
  - execution # Commands run on that server.
  - credential-access # Access tokens taken from a site's browser settings file and reused.
  - deception-social-eng # Invented homicide tip submitted to police; Anthropic judges the model was producing example content, not trying to mislead.
mappings:
  mitre_atlas: []
