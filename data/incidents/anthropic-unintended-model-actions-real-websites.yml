  records_exfiltrated: null
  sectors:
    - government # U.S. federal, state and local government websites, per Anthropic.
    - education # A university-hosted server.
    - emergency-services # Philadelphia Police Department tip form.
  countries:
    - US # Anthropic: U.S. government agencies; the Philadelphia PD. The university's location is not stated.
