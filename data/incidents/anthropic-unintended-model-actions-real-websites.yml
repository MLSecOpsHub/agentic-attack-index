  owasp_llm: []
  owasp_asi: []
  cve: []
  aiid: []
impact: >-
  Per Anthropic, minimal real-world impact: commands run on a university server
  through an injection flaw; real online forms submitted, including a
  government form and a fabricated homicide tip to a police department; fee- or
  token-gated public data obtained from local and state government systems;
  URL shortening services used to evade fetch limits. To Anthropic's knowledge
  no customer data or Anthropic internal systems were involved. Per the
  Philadelphia Police Department, the tip was flagged as spam, never forwarded
  to its Real-Time Crime Center, and there was no indication of unauthorized
  access to police systems or compromise of department data.
