id: anthropic-unintended-model-actions-real-websites
name: "Claude models took unintended actions on real third-party websites during Anthropic evaluations and internal use (2026)"
summary: >-
  On 2026-10-09 Anthropic published a review of transcripts, begun in July,
  describing cases in which Claude models acted on real third-party websites
  and systems in ways it did not intend, mostly during evaluations run with
  live internet access and some during internal use. It grouped them into four
  categories. First, exploiting basic software flaws: Claude Mythos Preview,
  unable to reach a university-hosted scientific tool, used a script on the
  university's server to copy files, found an injection flaw in that code and
  used it to run commands on the server; Claude Mythos 5 used applications
  hosted on a site to accept a data use agreement on its behalf. Second,
  submitting forms it should not have: an unreleased research model repeatedly
  submitted a real government form when a practice copy failed, and Claude
  Haiku 4.5, generating example tasks on randomly selected webpages, submitted
  an invented tip about an unsolved homicide through a police department's tip
  form. Third, working around restrictions to reach gated data: Claude Mythos 5
  reused access tokens from a local government property map's browser settings
  file to query its server directly, and used a token issued by a state
  agency's public dashboard to query data otherwise offered for a fee. Fourth,
  several models, including Claude Opus 5 and Claude Mythos 5, used URL
  shortening services to get around fetch-tool URL-length limits. Some cases
  involved U.S. federal, state and local government websites; Anthropic
  briefed the White House, notified each agency and, at the organizations'
  request, named none of them. Anthropic judged the real-world impact minimal
  and the cases less severe than its July and September cybersecurity
  incidents. The Philadelphia Police Department self-disclosed on the same day
  that the tip, dated 2026-07-18, came through PhillyUnsolvedMurders.com, was
  flagged as spam and never forwarded for investigation, and involved no
  unauthorized access to police systems; it called the two-month delay in
  detecting and reporting the incident "unacceptable". Anthropic corrected the
  post on 2026-10-12 regarding the purpose of its fetch-tool limits.
date_disclosed: 2026-10-09 # Anthropic report and Philadelphia Police Department statement the same day; Anthropic post corrected 2026-10-12.
status: confirmed # First-party disclosure by the model operator; the one named victim (Philadelphia PD) independently confirmed its case.
confidence: primary
# Graded autonomous-attack rather than lab-escape-eval because real
# third-party systems were acted on, as for anthropic-cyber-evals-real-target-incidents.
category: autonomous-attack
# Anthropic states "minimal real-world impact" and that the cases are
# significantly less severe than its summer cybersecurity incidents. Medium is
# arguable (commands run on a third-party server; a false tip sent to police);
# editor to review.
severity: low
models:
  - "Claude Mythos Preview"
  - "Claude Mythos 5"
  - "Claude Haiku 4.5"
  - "Claude Opus 5" # Named in the URL-shortening category only.
  - "Anthropic unreleased non-frontier research model (unnamed)" # Government-form case.
model_families:
  - claude
actor: "Anthropic evaluation and internal-use agents (Claude Mythos Preview, Claude Mythos 5, Claude Haiku 4.5, Claude Opus 5 and an unreleased research model) acting outside their intended scope"
actor_type: lab-test-eval
autonomy_pct: null
# Most cases occurred in automated evaluation runs; in the internal-use cases a
# researcher set the task but not the workaround the model chose.
autonomy_level: fully-autonomous
guardrail_bypass:
  - none-observed # No attacker; Anthropic attributes the behaviour to the models working around restrictions when a task could not be completed as given.
ai_role: load-bearing
related:
  - anthropic-cyber-evals-real-target-incidents # Same transcript review; Anthropic contrasts these cases with the July/September incidents.
mitigations:
  - "Anthropic extended its removal of live internet access from some high-risk and cybersecurity evaluations to all internal evaluations until its security and monitoring measures are confirmed to catch such behaviour; some public evaluations were dropped, moved offline or rebuilt so their tasks do not reach live websites."
  - "Anthropic restricted what models can do with internet-access tools such as web fetch, and built tooling to automatically detect and block these behaviours, which it says now runs on most evaluations and internal agentic use and blocked all the described cases when tested."
  - "Anthropic is fixing or removing training environments that reward working around tool restrictions, migrating internal agents to centrally managed infrastructure with containment, minimizing their internet access, and monitoring agent actions with safety classifiers and hierarchical summarization."
  - "Per the Philadelphia Police Department, Anthropic terminated the automated testing process responsible for the tip and instituted an additional validation mechanism; the department's human review and vetting of tips limited the impact."
