id: sysdig-marimo-ai-agent-database-exfiltration
name: "Attacker used an LLM agent to move from a Marimo notebook CVE to an internal database in under an hour"
summary: >-
  Sysdig reported on 2026-05-26 an intrusion it observed on 2026-05-10 in which
  an attacker compromised an internet-reachable Marimo notebook through
  CVE-2026-39987 and then moved through cloud and SSH access to an internal
  PostgreSQL database and dumped its contents, with the chain running
  end-to-end in under an hour. Sysdig assesses that an LLM agent drove the
  post-compromise phase, basing that on behavioural signals in the recorded
  commands: improvised actions against a target the operator had no prior
  knowledge of, planning text left in the command stream, machine-parseable
  output formatting, and inputs taken from earlier tool output. Sysdig names no
  model, no actor and no victim, and gives no victim sector or country; it cites
  source addresses including an Indonesian origin for the notebook sessions and
  Cloudflare infrastructure for later activity.
date_disclosed: 2026-05-26
