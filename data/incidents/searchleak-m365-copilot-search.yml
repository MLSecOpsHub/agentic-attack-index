id: searchleak-m365-copilot-search
name: "SearchLeak — one-click data exfiltration via Microsoft 365 Copilot Enterprise Search (CVE-2026-42824)"
summary: >-
  Varonis Threat Labs (researcher Dolev Taler) disclosed SearchLeak, a one-click
  vulnerability in Microsoft 365 Copilot Enterprise Search. A crafted link
  caused Copilot to treat attacker-supplied text as a prompt, search the
  victim's mailbox, calendar and indexed organisational content, and send the
  results to an attacker-controlled server by chaining output-rendering and
  content-security weaknesses. Microsoft assigned CVE-2026-42824 (Information
  Disclosure, CVSS 6.5) on 2026-06-04 and states the issue was fully mitigated
  server-side with no customer action required.
date_disclosed: 2026-06-04 # MSRC/NVD publication date; the Varonis page shows only "Last updated June 15, 2026".
status: confirmed # Demonstration; not observed in the wild (MSRC: Exploited: No). Confirmed on the first-party Microsoft CVE, as echoleak.
confidence: primary # Varonis is the discloser; MSRC is the vendor.
category: agent-hijack-prompt-injection
severity: medium # CVSS 6.5 per MSRC; Varonis calls it "critical".
models: [] # Underlying model not named by Varonis.
model_families:
  - other
actor: "Varonis Threat Labs (Dolev Taler)" # MSRC acknowledgment: Dolev Taler with Varonis.
actor_type: researcher
autonomy_pct: null
autonomy_level: not-applicable # The agent was the hijacked component.
guardrail_bypass:
  - indirect-prompt-injection # Attacker text delivered in a link was executed as a prompt (Varonis).
ai_role: load-bearing
related:
  - echoleak-m365-copilot # Same product family (Microsoft 365 Copilot), earlier exfiltration disclosure.
mitigations:
  - "Microsoft fully mitigated the vulnerability; no customer action is required (MSRC)."
  - "Varonis: monitor for suspicious Copilot Search URLs, review content-security allowlists for domains that fetch user-supplied URLs, and sanitise AI output at render time; users should inspect Microsoft 365 links with long encoded parameters."
