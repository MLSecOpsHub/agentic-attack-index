  aiid: []
impact: >-
  Demonstrated one-click exfiltration of email content, security codes, meeting
  details and private organisational files reachable by Microsoft 365 Copilot
  Enterprise Search. Mitigated server-side by Microsoft; not publicly disclosed
  or exploited at release per MSRC.
