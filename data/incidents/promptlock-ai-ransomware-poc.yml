impact: >-
  No real-world impact: an academic proof-of-concept demonstrating a closed-loop,
  LLM-orchestrated ransomware workflow (reconnaissance, exfiltration and
  encryption). ESET maintains it is the first known case of AI-powered
  ransomware while agreeing it was a proof-of-concept, not operational malware.
