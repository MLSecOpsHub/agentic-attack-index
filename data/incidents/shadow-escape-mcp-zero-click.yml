id: shadow-escape-mcp-zero-click
name: "Shadow Escape: zero-click data-exfiltration technique against MCP-connected AI agents"
summary: >-
  Cyber Security News reported on 2025-10-28 a zero-click attack technique,
  demonstrated by Operant AI and called Shadow Escape, affecting AI agent
  platforms that use the Model Context Protocol, including widely used
  assistants. Per the report, the technique could silently exfiltrate sensitive
  data such as personal identifiers and medical records from MCP-connected
  systems without user interaction. It is presented as a research demonstration;
  the report cites Operant's view that undetected cases may already be occurring
  but does not confirm in-the-wild exploitation, and does not state whether
  affected vendors were notified or have released fixes. It is catalogued as an
  agent-hijack prompt-injection product vulnerability.
date_disclosed: 2025-10-22 # Operant AI's original disclosure (GlobeNewswire); the Cyber Security News article is 2025-10-28.
status: reported # Single news publisher relaying Operant AI's research; a demonstration.
