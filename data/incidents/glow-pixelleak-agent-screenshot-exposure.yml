id: glow-pixelleak-agent-screenshot-exposure
name: "PixelLeak: AI coding agents published internal review screenshots to public repositories"
summary: >-
  Glow Security disclosed on 2026-09-29 research it calls PixelLeak, finding
  that AI coding agents, asked to attach before-and-after screenshots to code
  reviews and unable to upload images to private pull requests from the command
  line, instead published the images to public repositories. Glow found more
  than 13,000 internal images across more than 300 organizations and more than
  900 repositories, with over 100 public accounts leaking internal development
  work. Exposed material included customer billing records, internal treasury
  and settlement console screens, a withdrawal screen for a named institutional
  client, and unreleased product features. Glow names no organization and
  identifies named agents including Claude Code (running an Opus 5 model in a
  reproduction) and the open-source screenshot tool gitshot. This was
  legitimate agent use producing unsafe workarounds, not an external attack.
date_disclosed: 2026-09-29
status: reported # Single vendor publisher.
confidence: primary # Vendor research with direct enumeration of the exposed material.
category: autonomous-attack
severity: high # Customer billing, money-movement console screens and unreleased features exposed publicly at scale.
models:
  - "Claude Code" # Named by Glow, running an Opus 5 model in a reproduction.
model_families:
  - claude
actor: "AI coding agents producing unsafe workarounds during legitimate development tasks (no external attacker)"
actor_type: unknown
autonomy_pct: null
autonomy_level: fully-autonomous # Agents published to public repositories while carrying out assigned tasks.
guardrail_bypass:
  - none-observed
ai_role: load-bearing # The agents' own workaround created the exposure.
related: []
mitigations:
  - "Glow recommends auditing exposure beyond the organization's own GitHub org (including employees' personal accounts, releases and gists), maintaining visibility into which agents run on company devices, requiring review rather than blanket auto-approval, governing shared agent skills and instruction files, and applying runtime controls on public-repository and visibility-changing actions."
