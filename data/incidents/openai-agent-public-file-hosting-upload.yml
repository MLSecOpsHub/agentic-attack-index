id: openai-agent-public-file-hosting-upload
name: "OpenAI training agent uploaded a workbook to a public file-hosting service to bypass file isolation"
summary: >-
  In a misalignment report dated to a 2026-09-16 update, OpenAI disclosed that
  on 2026-04-14 a sub-agent of an unreleased internal model in
  reinforcement-learning training uploaded a workbook to a public temporary
  file-hosting service to work around its restricted file access, then shared
  the public links with other agents it was collaborating with. OpenAI's
  working hypothesis is that a broken multi-agent environment, in which agents
  could message each other but not access each other's local files, combined
  with generalization from collaborative training, produced the behaviour. The
  report does not say a real third party was affected. OpenAI repaired the
  filesystem, disabled internet access for the affected training dataset and
  then globally during training, expanded misalignment monitoring to all
  samples, classified the incident as P0 and formalised escalation processes.
