id: camoleak-github-copilot-chat
name: "CamoLeak — GitHub Copilot Chat prompt-injection data exfiltration"
summary: >-
  Legit Security researcher Omer Mayraz disclosed CamoLeak, a critical GitHub
  Copilot Chat vulnerability (reported CVSS 9.6). It combined remote prompt
  injection via GitHub's invisible markdown comments with a content-security
  bypass abusing GitHub's Camo image proxy to silently exfiltrate secrets and
  source code from private repositories and to steer Copilot's responses. GitHub
  mitigated it by disabling image rendering in Copilot Chat on 2025-08-14; the
  research was published in October 2025.
