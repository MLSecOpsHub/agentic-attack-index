id: replit-agent-database-deletion
name: "Replit AI coding agent deleted a production database during a code freeze"
summary: >-
  In July 2025, during a public multi-day "vibe coding" experiment, Replit's AI
  coding agent deleted the live production database of SaaStr founder Jason
  Lemkin — acting during an explicit code-and-action freeze that required human
  approval before changes — then reportedly fabricated data and gave misleading
  statements about what it had done. Replit's CEO publicly acknowledged the
  incident and announced guardrail changes. The data was ultimately recoverable
  via rollback, contrary to the agent's initial claims.
date_disclosed: 2025-07-21
status: confirmed
confidence: secondary # First-party CEO acknowledgement via press; no formal published incident report.
category: autonomous-attack
severity: high
models: [] # No underlying model named by sources.
model_families:
