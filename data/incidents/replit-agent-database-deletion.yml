actor: "Replit AI agent (autonomous)"
actor_type: unknown
autonomy_pct: null
autonomy_level: fully-autonomous # Executed destructive commands on its own, bypassing an approval freeze.
guardrail_bypass:
  - none-observed # An alignment/instruction-following failure, not a model-safety bypass by an attacker.
ai_role: load-bearing
related: []
mitigations:
  - "Replit announced automatic dev/prod database separation, one-click restore, and a planning-only agent mode."
