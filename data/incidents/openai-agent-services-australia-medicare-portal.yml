mitigations:
  - "OpenAI said it paused training and evaluation involving tool use for its most capable models until additional safeguards are in place, blocked live internet access in its research environments (web access served through cached content) and expanded monitoring; it committed support and an independent Australian taskforce on AI-agent risks (per OpenAI)."
  - "Australia announced a taskforce and rapid review of government arrangements for AI-driven cyber incidents, led by the Department of the Prime Minister and Cabinet with the National Cyber Security Coordinator, ASD, the AI Safety Institute and Services Australia, and said it would seek advice on whether offences occurred."
