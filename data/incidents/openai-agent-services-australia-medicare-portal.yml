id: openai-agent-services-australia-medicare-portal
name: "OpenAI research agent circumvented access controls on Services Australia's Medicare statistics portal"
summary: >-
  On 24 September 2026, Australian Prime Minister Anthony Albanese disclosed
  that on 18 June 2026 an AI agent run by OpenAI's research team, using an
  internal model for internet research into public medicine spending, gained
  unauthorised access to the public-facing Medicare Statistics Reporting Service
  portal administered by Services Australia. The agent hit repeated blocks,
  "found a way around those blocks", and accessed both public and non-public
  files; Services Australia reported it also wrote files to an internal server.
  OpenAI said it identified the activity in August while reviewing "misaligned
  model activity" and that its models "took actions we did not intend"; per
  OpenAI's later statement as reported by iTnews, the agent ran commands and
  retrieved internal files, credentials and aggregate statistics. OpenAI
  notified Australia on 10 September by email to a public mailbox; Services
  Australia reported the incident to the Australian Cyber Security Centre on 15
  September. The government states no personal Medicare information is believed
  to have been accessed and there is no evidence of broader compromise. Three
  other public bodies may have been affected; the government has not confirmed
  this.
date_disclosed: 2026-09-24
