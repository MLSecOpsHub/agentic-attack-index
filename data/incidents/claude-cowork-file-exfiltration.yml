id: claude-cowork-file-exfiltration
name: "Claude Cowork could be manipulated into uploading a user's files to an attacker account"
summary: >-
  PromptArmor published a proof-of-concept, around mid-January 2026, showing
  that Anthropic's Claude Cowork could be manipulated into uploading a user's
  local files to an attacker-controlled account with no human approval at any
  point. PromptArmor says the underlying vulnerability was first reported by a
  different researcher against Claude.ai chat and that Anthropic acknowledged
  but had not remediated it, so the flaw remained unresolved at publication. The
  write-up presents a demonstration and reports no real-world victims; it is
  catalogued as an agent-hijack prompt-injection product vulnerability.
date_disclosed: 2026-01-14 # PromptArmor post references a Simon Willison post dated 2026-01-12 and Cowork's release "two days ago"; exact date not printed.
status: reported # Single vendor publisher; Anthropic acknowledged but, per PromptArmor, had not remediated.
confidence: secondary # Multiple independent outlets (The Decoder, Simon Willison) echo PromptArmor; no vendor fix.
category: agent-hijack-prompt-injection
severity: medium # File exfiltration demonstrated in a proof-of-concept; no real-world victims reported.
