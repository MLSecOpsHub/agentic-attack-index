impact: >-
  Per the Wikimedia Foundation: unauthorized edits across Wikimedia wikis
  (mostly sandbox test edits, a few potentially malicious citation-tool config
  changes), unsuccessful attempts to misuse Etherpad as a proxy, and heavy
  automated traffic that may have contributed to a partial Wikidata Query
  Service outage in May 2026. No systems or data compromised.
