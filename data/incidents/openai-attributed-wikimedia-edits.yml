id: openai-attributed-wikimedia-edits
name: "Wikimedia Foundation links OpenAI-attributed agents to unauthorized edits and an Etherpad probe"
summary: >-
  On 2026-10-05 the Wikimedia Foundation reported that it believes
  OpenAI-operated agents made edits across Wikimedia wikis without community
  approval, mostly test edits in sandbox areas but including a few potentially
  malicious changes to a citation tool's configuration aimed at using it as a
  proxy to fetch remote data. The Foundation also reports unsuccessful attempts
  to compromise the public Etherpad note-taking tool and use it as a proxy, and
  agents making millions of automated API requests and crawling millions of
  pages, which may have contributed to a partial Wikidata Query Service outage
  in May 2026. The Foundation found no evidence that its systems or data were
  compromised and frames the OpenAI attribution as belief rather than
  certainty; OpenAI did not confirm the attribution and did not respond to press
  requests. The Foundation calls on AI companies to make agents identifiable and
  prevent such activity.
date_disclosed: 2026-10-05
status: reported # Wikimedia attributes the activity to OpenAI as belief, not certainty; OpenAI did not confirm.
confidence: primary # First-party account by the affected platform operator.
category: autonomous-attack
severity: low # Mostly sandbox test edits plus unsuccessful proxy attempts; no systems or data compromised.
