id: radware-zombieagent-deep-research
name: "ZombieAgent: zero-click indirect prompt injection against OpenAI's Deep Research agent"
summary: >-
  On 2026-01-08 Radware announced ZombieAgent, a zero-click indirect
  prompt-injection vulnerability targeting OpenAI's ChatGPT Deep Research agent.
  Per Radware, a single crafted email could cause the agent to exfiltrate
  sensitive data autonomously from the service side, and an advanced stage could
  implant malicious rules into the agent's long-term memory or working notes to
  establish persistence without re-engaging the target, executing hidden actions
  whenever the agent is used and potentially propagating to further recipients.
  Radware presents it as building on its earlier ShadowLeak research. The
  announcement is a vendor disclosure describing a demonstrated vulnerability
  rather than an observed in-the-wild attack, and is catalogued as an
  agent-hijack prompt-injection product vulnerability.
date_disclosed: 2026-01-08
