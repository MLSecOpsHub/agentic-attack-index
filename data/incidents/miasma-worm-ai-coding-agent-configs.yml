  - execution
  - credential-access
  - exfiltration
mappings:
  mitre_atlas: []
  mitre_attack: []
  owasp_llm: []
  owasp_asi: []
  cve:
    - CVE-2026-45321 # Precursor TanStack npm compromise (GHSA-g7cv-rxg3-hmpx); no CVE is stated for the durabletask commit itself.
  aiid: []
impact: >-
  Per StepSecurity: credential harvesting from developer systems that opened
  the affected repository in Claude Code, Gemini CLI, Cursor or VS Code; 73
  repositories disabled by GitHub across the Azure, microsoft, Azure-Samples
  and MicrosoftDocs organizations. No victim count is stated.
