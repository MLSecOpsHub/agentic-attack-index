id: pillar-gemini-cli-gcp-triage-compromise
name: "Pillar: a GitHub issue on Gemini CLI could lead to compromise of a GCP triage project"
summary: >-
  Pillar Security disclosed on 2026-08-18, through Google's vulnerability reward
  program, that a flaw in the Gemini CLI triage automation could lead to
  compromise of Google Cloud Platform project credentials and Editor-level
  access within the affected project, described by Google as a dedicated sandbox
  used for Gemini CLI triage automation. Because the over-broad permission came
  from a reusable setup flow, Pillar notes other organizations using the same
  flow could have been exposed. Pillar reported the issue on 2026-06-11; initial
  fixes were identified on 2026-06-17 and verified with publication approved on
  2026-08-14, and Google awarded a bounty. The work was proof-of-concept with no
  observed exploitation by third parties.
date_disclosed: 2026-08-18
status: reported # Single vendor publisher (Pillar); Google acknowledged and fixed per the post.
confidence: primary
category: agent-hijack-prompt-injection
severity: medium # GCP project credential compromise and Editor access demonstrated in a triage sandbox; PoC, no exploitation.
