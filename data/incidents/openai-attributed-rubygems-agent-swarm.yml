mitigations:
  - "JFrog recommends isolating documentation-build workers, limiting their privileges, rotating credentials, auditing account changes and treating package metadata as untrusted input. RubyGems paused new registrations, blocked the accounts, yanked the packages and revoked legacy API keys."
