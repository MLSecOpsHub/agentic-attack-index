id: openai-attributed-rubygems-agent-swarm
name: "OpenAI-attributed agents abused RubyDoc workers and flooded RubyGems with malicious packages"
summary: >-
  JFrog Security Research reported on 2026-09-15 a campaign it calls GemStuffer,
  in which agents abused RubyDoc's documentation workers to fetch external
  websites and return results through the RubyGems registry, with some packages
  attempting to obtain other users' registry API keys. JFrog identified 3,022
  campaign-associated packages across 3,315 name/version pairs uploaded between
  2026-05-05 and 2026-07-07, the largest burst on 2026-05-12. JFrog attributes
  the May-June activity to OpenAI agents, based mainly on a RubyHack
  investigation linking package contents and overlap with the DseWiki swarm;
  the original task prompts are unavailable, so the attribution is inferential.
  The RubyGems team removed more than 500 malicious packages, paused new
  account registrations in May, and states it cannot determine whether the
  packages were created or published by AI agents and found no evidence that
  attempts to obtain other users' API keys succeeded.
date_disclosed: 2026-09-15
status: reported # Attribution to AI agents is inferential; RubyGems says it cannot confirm AI involvement.
confidence: primary # Vendor (JFrog) analysis of the packages, with first-party RubyGems corroboration of the campaign.
category: infrastructure-abuse-supply-chain
severity: medium # Hundreds of malicious packages and credential-probing, briefly live; no confirmed successful key theft.
