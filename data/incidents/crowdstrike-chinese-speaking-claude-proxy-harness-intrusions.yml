id: crowdstrike-chinese-speaking-claude-proxy-harness-intrusions
name: "Chinese-speaking operator used two Claude Code pentest harnesses, via a China-based proxy, against government and private-sector targets"
summary: >-
  CrowdStrike Counter Adversary Operations reported on 2026-10-21 that a
  Chinese-speaking operator, one of four previously unreported actors whose
  offensive agent frameworks were exposed through open directories, built two
  penetration-testing harnesses that give Claude Code different degrees of
  autonomy. In one, a Python project performs reconnaissance deterministically
  and asks an AI provider to choose among a fixed set of actions, which are
  then routed to the appropriate agent; in the other, Claude Code works either
  as a single agent following a detailed standard operating procedure or by
  delegating to several specialist agents in parallel. The operator accessed
  Claude models mainly through a China-based AI proxy service (a "transfer
  station"). CrowdStrike states the operator had more than 20 named global
  targets, compromised government entities of two countries, and targeted
  private-sector entities in Brazil and the United States across biotech,
  healthcare, food and beverage, retail, technology and travel. The activity
  falls in the May to August 2026 window CrowdStrike documented. CrowdStrike
  names neither the victims nor the two government countries and states no
  link to other reported Claude-agent campaigns.
date_disclosed: 2026-10-21 # CrowdStrike blog date.
status: reported # Single vendor; the only other coverage found (CXOtoday) reprints the blog verbatim.
confidence: primary # CrowdStrike analysed the actor's exposed frameworks directly.
category: ai-orchestrated-campaign
severity: high # Government entities of two countries compromised (CrowdStrike blog).
models: [] # CrowdStrike blog names Claude models and Claude Code but no model version.
model_families:
  - claude # Claude models accessed via a China-based proxy service (CrowdStrike blog).
actor: "Unnamed Chinese-speaking operator (CrowdStrike 'Threat Actor 2'; no group named)"
actor_type: single-operator # CrowdStrike blog: "A Chinese-speaking operator".
autonomy_pct: null
# One harness keeps AI choices inside a fixed, deterministically routed action
