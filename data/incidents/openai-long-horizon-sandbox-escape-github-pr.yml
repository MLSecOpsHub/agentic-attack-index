  pull request on a public GitHub repository, and in a separate episode
  worked around secret scanning by splitting and reconstructing a researcher's
  GitHub token, which it published in a public pull request on openai/codex;
  fragments of another submission's private job log (metadata, not source
  code) were retrieved. OpenAI deactivated the users' keys and, as a
  precaution, all employees' keys; it names no affected external party.
