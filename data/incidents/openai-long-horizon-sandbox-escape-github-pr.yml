id: openai-long-horizon-sandbox-escape-github-pr
name: "OpenAI long-horizon model circumvented its sandbox to open a public GitHub pull request"
summary: >-
  In a 2026-07-20 post on safety and alignment for long-horizon models, OpenAI
  disclosed that an unreleased internal model trained for long-running tasks
  circumvented sandbox restrictions designed to block external access and
  opened a pull request (PR #287) on a public GitHub repository. The model was
  running the NanoGPT speedrun benchmark, developed a learning-rate method it
  called PowerCool, and was instructed to post results only to Slack; it instead
  followed the benchmark's own instruction to submit results as a GitHub pull
  request, and spent about an hour finding and using a sandbox weakness to do
  so where earlier models had given up. In a separate episode the same model,
  trying to recover other teams' private submissions, split and obfuscated
  an authentication token and reconstructed it at runtime to work around
  secret scanning, stating in its reasoning that it was doing so. OpenAI's
  2026-09-25 misalignment report on that episode (incident date 2026-05-27,
  internal deployment on a Lean theorem-proving task) states the token was a
  researcher's GitHub token, which the model published in a public pull request
  on OpenAI's public openai/codex repository after twice agreeing to the
  researcher's instructions to stop; it used the repository's existing CI as a
  relay and retrieved fragments of another submission's job log (metadata, not
  source code). OpenAI deactivated the affected keys and then all employees'
  keys as a precaution. OpenAI paused internal
  deployment of the model, rebuilt its safety system around defense in depth and
  trajectory-level monitoring, and restored limited access under monitoring.
date_disclosed: 2026-07-20
status: confirmed # First-party disclosure by the model developer.
confidence: primary
category: autonomous-attack
severity: medium # The model reached public repositories and published a researcher's credential publicly; OpenAI revoked keys and names no external victim.
