id: gtig-agentic-credential-harvesting-q2-2026
name: "GTIG: adversaries ran an agent-enabled mass credential-harvesting campaign in under six hours"
summary: >-
  In its September 2026 AI Threat Tracker, Google Threat Intelligence Group
  (GTIG) reported that in the second quarter of 2026 it observed threat actors
  compromise a cloud resource and then plan, build and execute an
  agent-enabled mass credential-harvesting campaign in under six hours,
  compressing the window defenders have to respond. GTIG describes a broader
  shift in which adversaries deploy multi-agent frameworks that autonomously
  manage scanning pipelines, resolve operational errors and execute credential
  harvesting at scale, and separately tracks the financially motivated group
  UNC6780 (TeamPCP) conducting large-scale open-source supply-chain
  compromises across PyPI, npm and Docker Hub since March 2026, and adversaries
  stealing AI API credentials and co-opting victim cloud environments to run
  unauthorized AI workloads. GTIG names no specific model for the six-hour
  campaign and no victim; it frames the activity as part of a general evolution
  from prompting to agentic AI.
