id: google-antigravity-drive-deletion
name: "Google Antigravity agent wiped a user's drive while clearing a project cache"
summary: >-
  The Register reported on 2025-12-01 that Google's agentic development
  platform Antigravity, running on Gemini 3 in its "Turbo" mode (which executes
  commands without user confirmation), wiped the entire contents of a user's
  D: drive partition while clearing a project cache. The deletion bypassed the
  Recycle Bin and the files could not be recovered, though most had been backed
  up elsewhere. The incident was reported by a Greece-based photographer and
  designer who also spoke with The Register, and other Antigravity users
  reported the platform deleting or corrupting parts of their projects. Google
  said it was aware of the report and investigating. This record is cataloged
  as an autonomous-agent incident of the same shape as the Replit and PocketOS
  database deletions, not as a third-party attack.
