id: coral-sleet-agentic-ai-workflow
name: "Coral Sleet (North Korea) operationalizes agentic AI tools across its attack workflow"
summary: >-
  In its 2026-03-06 report "AI as tradecraft", Microsoft Threat Intelligence
  described how Coral Sleet, a North Korean state actor formerly tracked as
  Storm-1877, has adopted agentic AI tools across its operations: lure
  development including fake company websites, remote infrastructure
  provisioning, and rapid payload testing and deployment. Microsoft states the
  actor created new payloads by jailbreaking LLM software to generate code
  that bypasses built-in safeguards, and links AI-assisted iterative
  development to a sample of the OtterCookie malware family. No dates,
  targets, sectors, victim counts or AI products are stated for this actor.
  Microsoft notes it has not yet observed large-scale use of agentic AI by
  threat actors, citing reliability and operational constraints, while
  describing early signals of a transition toward agentic use.
