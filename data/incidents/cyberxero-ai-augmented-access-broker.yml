impact: >-
  Per SOCRadar: data on more than 628,000 Ukrainian individuals held by the
  actor after confirmed exfiltration at four Ukrainian organisations,
  including 564,073 subscriber records (with home addresses and account
  numbers) and 213,340 access-log entries from a district heating provider in
  Kharkiv; one automated run scanned 4,708 targets and confirmed access to 429
  WordPress administration panels in 61 seconds; administrator passwords
  overwritten at e-commerce targets; more than 40 affected organisations
  worldwide, including in Ukraine, Poland and China, with Pakistani entities
  targeted without a confirmed result. SOCRadar warns that the Kharkiv data could pose a
  physical risk to identifiable civilians. No evidence of the access being
  sold was recovered.
