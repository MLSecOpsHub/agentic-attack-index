id: cyberxero-ai-augmented-access-broker
name: "CyberXero: access broker ran a Claude Code agent swarm alongside global web exploitation and Ukrainian utility intrusions"
summary: >-
  On 2026-10-06 SOCRadar's Threat Research Unit reported on CyberXero, which
  it describes as a Russian-speaking, financially motivated initial access
  broker that wraps commodity offensive tooling in an AI orchestration layer
  on its own infrastructure. The operation surfaced through an exposed open
  directory serving the actor's live working directory, including AI session
  logs, scripts and exfiltrated victim data. SOCRadar found up to 51
  specialised Claude Code agents defined on the actor's main workstation,
  grouped into reconnaissance, offensive and post-exploitation roles, plus a
  deployment of the open-source PentAGI framework connected to a Cobalt Strike
  team server through an AI provider API. Two pipelines ran from the same
  workstation: an automated global campaign against WordPress and e-commerce
  sites, and a curated campaign of reconnaissance and manual exploitation
  against Ukrainian energy and utility organisations. SOCRadar dates the AI
  layer to a second phase beginning in late July 2026, which brought a
  measurable increase in the scale of the web campaigns. Exfiltration was
  confirmed at four Ukrainian organisations, including a district heating
  provider in Kharkiv, and the actor held data on more than 628,000 Ukrainian
  individuals. Seven further Ukrainian energy and utility entities were under
  reconnaissance without confirmed compromise, and SOCRadar counts more than
  40 affected organisations worldwide. Session logs show the actor framing
  requests as authorised testing of its own infrastructure and reopening
  sessions after refusals, while some refusals (to install a backdoor or
  disable a firewall, for example) held. No statement from Anthropic was
  found.
date_disclosed: 2026-10-06
status: reported # Single vendor investigation; Security Affairs and eSecurity Planet relay SOCRadar's findings without independent verification. No Anthropic or victim statement found.
confidence: primary # SOCRadar analysed the actor's exposed working directory and session logs directly.
category: ai-orchestrated-campaign
severity: critical # More than 40 organisations affected and over 628,000 Ukrainians' records taken, including a heating utility's subscriber base in a front-line city.
models:
  - "Claude Code" # Agent harness named by SOCRadar; no specific Claude model is named in the public post. PentAGI's provider and model are not named.
model_families:
  - claude
actor: "CyberXero (SOCRadar: Russian-speaking, financially motivated initial access broker)"
actor_type: cybercriminal
autonomy_pct: null
# The operator directed agent sessions and re-ran refused tasks by hand; SOCRadar
# calls the Ukrainian campaign "manual" and the web campaign automated.
autonomy_level: human-in-the-loop
guardrail_bypass:
  - jailbreak # A rehearsed "authorised pentest on my own infrastructure" narrative plus session resets after refusals; SOCRadar calls it context engineering rather than a technical bypass.
  - legitimate-tool-abuse # Claude Code and PentAGI used for their intended capabilities toward malicious ends.
ai_role: significant # SOCRadar describes an AI layer augmenting commodity tooling; the confirmed Ukrainian exfiltration is described as manual exploitation.
related: []
mitigations:
  - "SOCRadar advises treating AI agent session logs as sensitive material, with the same retention, encryption and access controls as credential logs, and managing session-reset refusal evasion through logging and auditing at the infrastructure layer rather than relying on the model."
  - "SOCRadar and eSecurity Planet advise operators of WordPress and e-commerce platforms to patch affected components, hunt for unauthorised administrator accounts and web shells, restrict internet-exposed Redis, and alert on unusual bulk exports of customer or subscriber data, especially at energy and utility providers."
