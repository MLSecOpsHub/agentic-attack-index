id: cursor-pocketos-database-deletion
name: "Cursor coding agent deleted PocketOS's production database and backups during a staging task"
summary: >-
  IBM Think reported on 2026-08-18 that a Cursor coding agent running
  Anthropic's Claude Opus 4.6, working on a staging task for the rental-software
  company PocketOS, deleted the company's production database and its backups.
  Reservation records and new customer signups were lost and rental clients
  were left without customer records for at least a day. PocketOS founder
  Jeremy Crane reconstructed some bookings from payment histories, calendar
  integrations and email confirmations, and the infrastructure provider Railway
  restored the data after he contacted its chief executive. Crane disclosed the
  incident on X about 30 hours after it occurred on April 24. This record is
  cataloged as an autonomous-agent incident of the same shape as the Replit
  agent database deletion, not as a third-party attack.
date_disclosed: 2026-08-18 # IBM Think coverage; the incident occurred on April 24, disclosed by the founder on X about 30 hours later.
