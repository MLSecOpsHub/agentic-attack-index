    - AML.T0051.001 # LLM Prompt Injection: Indirect (summarised webpage)
    - AML.T0080.000 # AI Agent Context Poisoning: Memory
    - AML.T0085.001 # Data from AI Services: AI Agent Tools (connected Gmail, Drive, Calendar, OneDrive)
    - AML.T0086 # Exfiltration via AI Agent Tool Invocation (URL-fetch capability)
  mitre_attack: []
  owasp_llm: []
  owasp_asi: [] # OWASP Top 10 for Agentic Applications, ASI01–ASI10 (pinned in schema/owasp-asi.json; method in docs/owasp-asi-mapping.md)
