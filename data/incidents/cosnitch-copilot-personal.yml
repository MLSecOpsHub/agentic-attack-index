  aiid: []
impact: >-
  Demonstrated exfiltration of email content (including plaintext credentials
  found in test mail), calendar details, Drive file metadata, chat history and
  memory, and persistent memory poisoning that Varonis says survives password
  changes and session revocation. Mitigated by Microsoft; Varonis has seen no
  evidence of in-the-wild exploitation.
