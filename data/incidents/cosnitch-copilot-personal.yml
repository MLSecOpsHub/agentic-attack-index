actor: "Varonis Threat Labs (Lior Adar)" # MSRC also credits Anshuman Goel (Microsoft) and Spandan Pokhrel on the same CVE.
actor_type: researcher
autonomy_pct: null
autonomy_level: not-applicable # The agent was the hijacked component.
guardrail_bypass:
