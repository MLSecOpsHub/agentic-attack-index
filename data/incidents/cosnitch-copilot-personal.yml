id: cosnitch-copilot-personal
name: "CoSnitch — one-click data exfiltration and memory poisoning in Microsoft Copilot Personal (CVE-2026-24301)"
summary: >-
  Varonis Threat Labs (researcher Lior Adar) disclosed CoSnitch, a one-click
  vulnerability in Microsoft Copilot Personal. A crafted link could make an
  authenticated Copilot session run attacker-supplied instructions without
  confirmation, query connected services such as Gmail, Drive, Calendar and
  OneDrive, and send the results to an attacker-controlled endpoint through
  Copilot's URL-fetch capability. A second chain used indirect prompt injection
  in a summarised webpage to write attacker instructions into persistent
  Copilot memory. Reported in December 2025; Microsoft assigned CVE-2026-24301
  (Information Disclosure, CVSS 8.8) and states it was fully mitigated on
  2026-08-18.
date_disclosed: 2026-08-18 # MSRC/NVD publication date; Varonis page shows "Last updated August 18, 2026".
status: confirmed # Demonstration; not observed in the wild (Varonis; MSRC: Exploited: No). Confirmed on the first-party Microsoft CVE, as echoleak.
confidence: primary # Varonis is the discloser; MSRC is the vendor.
category: agent-hijack-prompt-injection
severity: high # CVSS 8.8 per MSRC; Varonis calls it "critical".
models: [] # Underlying model not named by Varonis.
model_families:
