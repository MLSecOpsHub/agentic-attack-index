id: amazon-q-developer-extension-compromise
name: "Amazon Q Developer VS Code extension compromise (data-wiping prompt injection)"
summary: >-
  An attacker used an inappropriately scoped GitHub token to merge malicious
  content into the open-source repository behind the Amazon Q Developer
  extension for Visual Studio Code, shipping it in release 1.84.0. The injected
  content was a system prompt instructing the AI coding agent to wipe local
  files and cloud resources. AWS confirmed the compromise in security bulletin
  AWS-2025-015 (CVE-2025-8217), revoked the credentials, removed the code and
  released a fixed version; per AWS the injected code failed to execute due to a
  syntax error.
