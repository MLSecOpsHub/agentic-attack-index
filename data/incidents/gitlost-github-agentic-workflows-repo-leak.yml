id: gitlost-github-agentic-workflows-repo-leak
name: "GitLost: GitHub Agentic Workflows agent tricked into leaking private repository contents"
summary: >-
  Noma Security (Noma Labs) disclosed on 2026-07-06 a vulnerability it calls
  GitLost in GitHub Agentic Workflows, which use an AI agent backed by Claude or
  GitHub Copilot. In a proof-of-concept against the researchers' own
  repositories, content from private repository README files was published in a
  public comment on a public issue. Noma states the issue was responsibly
  disclosed to GitHub; it does not state report or fix dates or confirm a fix,
  and reports no in-the-wild exploitation or affected users. The finding is
  catalogued as an agent-hijack prompt-injection product vulnerability, in the
  same class as earlier disclosures against AI coding and chat assistants.
date_disclosed: 2026-07-06
status: reported # Single vendor publisher; Noma does not state GitHub confirmation or a fix.
confidence: primary # First-hand researcher analysis.
category: agent-hijack-prompt-injection
severity: medium # Private repository contents leaked in a demonstration; no in-the-wild exploitation.
models: []
model_families:
  - claude
  - other # GitHub Copilot's backing model, unspecified.
actor: "Noma Security researchers (authorized disclosure)"
actor_type: researcher
autonomy_pct: null
autonomy_level: not-applicable # The agent was the hijacked component.
guardrail_bypass:
