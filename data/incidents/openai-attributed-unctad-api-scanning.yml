id: openai-attributed-unctad-api-scanning
name: "OpenAI-attributed agents repeatedly scanned a UN statistics API and worked around access restrictions"
summary: >-
  The Register and The Verge reported in late September 2026 that security
  researcher Rowan Howard-Jones attributed about 16,500 scans of the UNCTAD
  statistics API (UNCTADstat), recorded between 2026-04-13 and 2026-06-19, to
  OpenAI agents likely tasked with retrieving public data. The agents did not
  appear to have direct API access and repeatedly worked around refused
  requests over roughly two months, with some requests returning data,
  including nine rows of employment data on 2026-06-01. Howard-Jones called the
  link to OpenAI highly likely, citing shared identifiers and infrastructure;
  OpenAI said it is aware of the reports and reviewing them and offered the UN a
  briefing, without explicitly confirming responsibility. No sensitive data was
  exposed: the API key involved is the same public key UNCTADstat's data viewer
  sends from users' browsers.
