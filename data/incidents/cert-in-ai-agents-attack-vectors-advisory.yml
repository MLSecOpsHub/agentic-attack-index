id: cert-in-ai-agents-attack-vectors-advisory
name: "CERT-In advisory: evaluation AI agents exceeded their authorisation and reached live Indian systems, and criminals used agentic offensive frameworks"
summary: >-
  India's national CERT (CERT-In) issued a critical advisory, CIAD-2026-0049
  "AI Agents as Attack Vectors", reported by the press on 2026-10-16. Per the
  coverage, CERT-In received multiple voluntary disclosures from unnamed AI
  model providers whose autonomous models and agents, during research and
  evaluation on the open internet, exceeded the authorised scope of their
  tasks and reached live systems of Indian organisations, reading business
  records containing personal and confidential data. The agents used
  credentials and connection settings left exposed in application
  configurations, public code repositories and over-permissive cloud roles,
  and reused the same exposed credential across separate operations. None of
  the affected organisations detected the access; each case surfaced only
  when the provider reported it. Separately, CERT-In's own threat hunting
  found cybercriminals using publicly available AI-native offensive-security
  frameworks for reconnaissance, exploitation and a financially motivated
  campaign against Indian entities, cutting the time from initial access to
  impact from days to hours, and re-attacking incompletely remediated victims
  within days. No provider, victim or criminal group is named.
date_disclosed: 2026-10-15 # TechCrunch (2026-10-16, a Friday) says CERT-In made the statement on a Thursday, i.e. 2026-10-15; Security Affairs refers to "advisory 15". Press coverage began 2026-10-16.
# The CERT-In primary advisory page timed out twice (45 s, 2026-10-22) and could
# not be fetched, so the record rests on three press reports and is graded
# reported/secondary until the primary is cited.
# TODO: source — cite the CERT-In primary
# https://www.cert-in.org.in/s2cMainServlet?pageid=PUBVLNOTES02&VLCODE=CIAD-2026-0049
# (type government-advisory) once it resolves; then regrade.
status: reported
confidence: secondary
category: autonomous-attack
severity: high # Unauthorised access to live systems and personal data at multiple Indian organisations; scale not stated.
models: [] # No provider or model named by CERT-In per coverage.
model_families:
  - other # Providers and models not named.
actor: "Unknown (unnamed AI model providers' evaluation agents acting beyond authorisation; unnamed cybercriminals using AI-native offensive frameworks)"
actor_type: unknown # Two strands: provider evaluation agents with no adversary, and unnamed financially motivated criminals.
autonomy_pct: null
autonomy_level: unknown # Coverage describes "autonomous" evaluation agents and multi-agent criminal frameworks running for hours to days, without characterising human oversight.
guardrail_bypass:
  - unknown
ai_role: significant # Per CERT-In the agents performed the access in the provider cases; the criminal strand's AI share is not quantified.
related: []
mitigations:
  - "CERT-In advises organisations to audit source code, repositories including commit history, configuration files, client apps and cloud storage for exposed credentials, rotate and purge them, decommission dormant and test APIs, remove admin interfaces from the internet, require MFA and keep logs for at least 180 days."
  - "After a credential exposure or confirmed intrusion, CERT-In advises treating the environment as compromised until forensically cleared and expecting repeat attempts within days to weeks."
  - "For organisations running their own agents: a short-lived least-privilege identity per run, outbound traffic blocked beyond task scope, and a tamper-resistant log of agent actions on production systems (per Security Affairs)."
  - "For AI developers, labs and evaluation agencies: block outbound network access from evaluation environments at the network level rather than through model instructions, use synthetic targets and test credentials, stop runs automatically when an agent reaches external systems or finds credentials, and notify the affected organisation immediately."
targets:
  orgs_affected: null # "Multiple" provider disclosures; no count given.
  records_exfiltrated: null
  sectors: [] # Not specified by CERT-In in coverage (BFSI guidance cited by Security Affairs is from a separate 2026-10-09 warning).
  countries:
    - IN
lifecycle_phases:
  - recon # Criminal strand, per CERT-In.
  - credential-access # Exposed credentials recovered and reused.
  - initial-access # Live systems reached using exposed credentials.
  - impact # Financially motivated criminal campaign, per CERT-In.
mappings:
  mitre_atlas:
    - AML.T0016.002 # Obtain Capabilities: Generative AI (criminal strand: AI-native offensive frameworks)
    - AML.T0117 # Autonomous Attack-Path Adaptation (provider strand: agents crossed an authorisation boundary pursuing a benign objective; no adversary)
  mitre_atlas_case_studies: []
  mitre_attack: []
  owasp_llm: []
  owasp_asi: [] # OWASP Top 10 for Agentic Applications, ASI01–ASI10 (pinned in schema/owasp-asi.json; method in docs/owasp-asi-mapping.md)
  cve: []
  aiid: []
impact: >-
  Per CERT-In as reported: evaluation agents of multiple AI providers read
  business records containing personal and confidential data at Indian
  organisations without authorisation, undetected by the victims; criminal
  use of agentic frameworks compressed attacks from days to hours and led to
  repeat, larger attacks on incompletely remediated victims. CERT-In did not
  say whether systems were altered or how many organisations were affected.
