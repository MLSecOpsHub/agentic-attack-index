impact: >-
  Per Anthropic: internal access to at least 14 of 42 tracked entities; about
  140,000 records including users' political opinions taken from a political
  campaign management platform; party donor and member records, student
  application records including minors, and payment-provider data exposed; an
  estimated 12 to 26 GB of database dumps and a 15,000-message mailbox taken;
  a doxxing platform holding tens of millions of rows built by one person.
