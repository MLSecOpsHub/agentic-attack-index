id: gtg-50029-hacktivist-agentic-recon
name: "GTG-50029 single hacktivist's Claude-built mass privacy attack on European political targets"
summary: >-
  In its September 2026 report "Countering misuse of AI", Anthropic disclosed a
  hacktivist campaign it tracks as GTG-50029, observed in the spring of 2026
  and run by "a single French-speaking actor" who used Claude to target
  European political parties, media outlets, think tanks and the SaaS
  providers those organizations rely on. Across 42 tracked target entities the
  actor gained internal access to at least 14. Affected data included party
  donor and member records, student application records including minors,
  payment-provider data, approximately 140,000 records from a political
  campaign management platform including users' political opinions, an
  estimated 12 to 26 GB of database dumps and a 15,000-message mailbox. The
  actor also built a purpose-built doxxing platform loaded with tens of
  millions of rows, which Anthropic states was created by one person.
  Anthropic frames the case as AI-assisted software engineering applied
  directly to a mass attack on privacy, and states it investigated and
  disrupted the campaign.
