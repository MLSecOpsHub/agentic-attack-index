mitigations:
  - "Unit 42 recommends treating AI models, API keys and AI integrations as core infrastructure with inventory, rate limits, least privilege and logging; preparing coordinated automated containment across identity, cloud and pipeline systems; monitoring for machine-speed behavioural patterns; and requiring multi-party review and immutable protections for infrastructure-as-code."
