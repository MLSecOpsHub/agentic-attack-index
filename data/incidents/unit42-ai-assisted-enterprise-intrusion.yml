id: unit42-ai-assisted-enterprise-intrusion
name: "Unit 42 investigation: AI agents sped an enterprise intrusion and hijacked the victim's cloud AI infrastructure"
summary: >-
  Palo Alto Networks Unit 42 reported on 2026-09-02 an investigation into an
  intrusion in which a human attacker directed multiple frontier AI agents in
  parallel to compress the time between attack steps. The attacker breached
  internal networks, source-code repositories, a secrets-management system and
  CI/CD pipelines, obtained root and administrative credentials and cloud
  access keys, and used the victim's own cloud AI endpoints as post-compromise
  infrastructure, offloading compute cost to the victim. An attempt to tamper
  with infrastructure-as-code was blocked by branch-protection controls, and
  the attacker had an agent produce an audit-style report of the victim's
  security posture. Unit 42 states the operational timeline ran under ten
  hours, the attack did not depend on novel zero-days, and the human set
  objectives while specialized agents executed tasks, shared results and
  re-planned. Unit 42 updated the post to clarify the event was an intrusion,
  not ransomware; it names no victim, model or actor nationality, and bases the
  AI-agent assessment on observed parallel model calls and AI-generated scripts.
