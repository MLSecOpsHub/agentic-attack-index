id: maxkb-sandbox-bypass-prompt-injection
name: "MaxKBypass — prompt injection to command execution outside the MaxKB agent sandbox (CVE-2026-77521)"
summary: >-
  Lasso Security (researcher Noy Pearl) disclosed MaxKBypass, CVE-2026-77521,
  in MaxKB, an open-source self-hosted knowledge-base and agent platform from
  FIT2CLOUD / 1Panel-dev. Attacker-controlled text on a crawled webpage placed in
  a public knowledge base led the victim's agent to invoke its shell tool during
  an unrelated question, without the human approval the platform was meant to
  require; in the official container, commands could run outside the intended
  sandbox as root. The proof of concept made an outbound request to an
  attacker-controlled server. The vendor fixed it in v2.10.5-lts and published
  the advisory, rated critical (CVSS 10.0), on 2026-09-02.
date_disclosed: 2026-09-02 # GitHub advisory GHSA-f36j-f34j-h3rx published 2026-09-02; the Lasso page header shows 2026-09-10 and its own timeline gives 2026-09-02; NVD published 2026-09-21.
status: confirmed # Demonstration; not observed in the wild (neither source reports exploitation). First-party vendor advisory with CVE and fix.
confidence: primary # Lasso is the discloser; the GitHub advisory is the maintainer's.
category: agent-hijack-prompt-injection
severity: critical # CVSS 10.0 per the GitHub advisory and Lasso.
models: [] # No model named by Lasso.
model_families:
  - other
actor: "Lasso Security (Noy Pearl)" # Author of the Lasso post; GHSA also credits two other Lasso accounts.
actor_type: researcher
autonomy_pct: null
autonomy_level: not-applicable # The agent was the hijacked component.
guardrail_bypass:
  - indirect-prompt-injection # Lasso: indirect prompt injection via knowledge-base content.
ai_role: load-bearing
related: []
mitigations:
  - "Upgrade MaxKB to 2.10.5-lts or later, which applies the sandbox to every command the model supplies (Lasso; GitHub advisory)."
  - "Use the Docker deployment and confirm the sandbox is actually enabled in the deployment mode; for agents with shell tools, verify isolation is engaged rather than assumed (Lasso)."
