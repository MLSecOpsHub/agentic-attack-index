  records_exfiltrated: null
  sectors: []
  countries: []
lifecycle_phases:
  - initial-access
  - execution
  - privilege-escalation # Commands ran outside the sandbox as root in the official container (Lasso).
mappings:
  mitre_atlas:
    - AML.T0051.001 # LLM Prompt Injection: Indirect
    - AML.T0070 # RAG Poisoning (instructions in knowledge-base content)
    - AML.T0053 # AI Agent Tool Invocation (shell execute tool)
    - AML.T0102 # Generate Malicious Commands (model-supplied shell command executed)
  mitre_attack: []
  owasp_llm: []
  owasp_asi: [] # OWASP Top 10 for Agentic Applications, ASI01–ASI10 (pinned in schema/owasp-asi.json; method in docs/owasp-asi-mapping.md)
  cve:
    - CVE-2026-77521
  aiid: []
impact: >-
  Demonstrated command execution by a hijacked MaxKB agent, outside its sandbox
  as root in the official container, with an outbound request to an
  attacker-controlled server. Lasso states, without a specific demonstration,
  that this design could let one tenant's chat reach another tenant's data and
  application secrets. Fixed in v2.10.5-lts; no in-the-wild exploitation
  reported.
