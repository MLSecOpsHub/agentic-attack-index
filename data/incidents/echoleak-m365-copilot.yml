id: echoleak-m365-copilot
name: "EchoLeak — zero-click prompt injection in Microsoft 365 Copilot"
summary: >-
  Aim Labs (Aim Security) disclosed EchoLeak, assigned CVE-2025-32711, a
  zero-click indirect prompt-injection vulnerability in Microsoft 365 Copilot.
  A single crafted email could cause the retrieval-augmented Copilot agent to
  pull sensitive organisational data from the user's context and exfiltrate it
  with no user interaction. Aim Labs termed the underlying class "LLM Scope
  Violation." Microsoft patched it server-side and states no customers were
  affected.
date_disclosed: 2025-06-11 # NVD/MSRC publication date; the research blog renders 2025-05-31.
status: confirmed
