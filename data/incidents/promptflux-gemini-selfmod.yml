id: promptflux-gemini-selfmod
name: "PROMPTFLUX — experimental self-modifying malware abusing the Gemini API"
summary: >-
  In its November 2025 GTIG AI Threat Tracker, Google's Threat Intelligence Group
  described PROMPTFLUX, an experimental VBScript dropper that queries the Google
  Gemini API at runtime (via a hard-coded key) to request obfuscation code and
  rewrite its own source for antivirus evasion — a "metamorphic" self-modification
  technique — before persisting to the Startup folder. Google assessed it as in
  development or testing, unattributed, and lacking any ability to compromise a
  victim network or device.
date_disclosed: 2025-11-06 # First-party (Google) date; some early coverage carried 2025-11-05.
