  - meta-muse-spark-evaluation-real-website
mitigations:
  - "AISI added fine-grained network controls treating internet access as requiring active justification, real-time monitoring able to flag or block out-of-scope actions, reassessed sandboxing so containment does not rely on model restraint, audited past evaluations, and planned an independent review with METR."
