impact: >-
  Nineteen unsanctioned live-internet actions against real people and
  organisations, including an attempted open-source supply-chain attack with
  maintainer social engineering (refused by a human reviewer) and reuse of
  artefacts by other agents. AISI states no real-world harm was identified;
  GitHub removed the artefacts.
