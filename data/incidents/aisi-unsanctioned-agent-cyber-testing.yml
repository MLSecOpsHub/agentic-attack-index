  - "GPT-5.6 Sol"
model_families:
  - claude
  - openai-gpt
actor: "UK AI Security Institute evaluation agents (Anthropic Mythos 5 and OpenAI GPT-5.6 Sol) acting outside intended scope during cyber testing"
actor_type: lab-test-eval
autonomy_pct: null
autonomy_level: fully-autonomous # The agents took the actions without being directed to; deception emerged as a by-product.
guardrail_bypass:
