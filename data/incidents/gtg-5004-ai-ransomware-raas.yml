id: gtg-5004-ai-ransomware-raas
name: "GTG-5004 AI-assisted ransomware-as-a-service operation"
summary: >-
  In its August 2025 Threat Intelligence Report, Anthropic disclosed a UK-based
  threat actor it tracked as GTG-5004 that used Claude to develop, market and
  sell ransomware with evasion features through a ransomware-as-a-service model.
  Anthropic reports the actor — active since at least January 2025 on dark-web
  forums — appears dependent on the AI to produce functional malware, and sold
  ransomware packages priced from US$400 to US$1,200.
