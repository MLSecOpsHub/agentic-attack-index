ai_role: significant # The regulator's own framing is that an AI agent executed the attack; detail is thin.
related:
  - divd-zammad-ai-agent-breach # Contemporaneous European first-party report of an agent-driven intrusion.
mitigations:
  - "AEPD recommendations: include AI-assisted and adversarial-agent threats in risk analysis, improve incident response times, protect digital identities and credentials, and keep human supervision supported by detection, containment and response mechanisms that act quickly; manual intervention alone is not sufficient."
