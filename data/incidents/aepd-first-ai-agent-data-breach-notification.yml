id: aepd-first-ai-agent-data-breach-notification
name: "Spain's AEPD receives first personal-data-breach notification for an attack executed by an AI agent"
summary: >-
  In September 2026 the Spanish Data Protection Agency (AEPD) published
  details of what it describes as the first notification it has received of a
  personal data breach "executed by design through an AI agent". Per
  SecurityWeek's 2026-09-16 report, a Spanish firm notified the regulator that
  an attacker gained access to its systems and that personal data could be
  modified and invoices accessed; the AEPD's investigation is ongoing and it
  chose its wording carefully. No AI model or vendor, victim organization,
  attacker or affected-person count is named. The AEPD used the case to
  recommend that organizations include AI-assisted and adversarial-agent
  threats in risk analysis, improve incident response times, protect digital
  identities and credentials, and keep human supervision backed by detection,
  containment and response mechanisms fast enough to matter.
date_disclosed: 2026-09-15 # Reuters and Spanish press reported the AEPD publication on 2026-09-15; SecurityWeek followed on 2026-09-16.
status: reported # Regulator statement relayed by press; the AEPD's own page returned HTTP 503 in this session and is not cited.
confidence: secondary
category: autonomous-attack
severity: medium
models: [] # No model or vendor named by the AEPD.
