id: notion-ai-web-search-exfiltration
name: "Notion 3.0 AI agents' web-search tool could be abused to exfiltrate private workspace data"
summary: >-
  CodeIntegrity published on 2025-09-19 research showing that the web-search
  tool in Notion 3.0's AI agents could be abused to send private Notion
  workspace data to an external server. The write-up presents a researcher
  demonstration rather than in-the-wild exploitation and does not state whether
  it went through coordinated disclosure or that Notion fixed it. CodeIntegrity
  argues that traditional role-based access controls no longer fully cover AI
  agents that chain actions across documents, databases and external
  connectors. It is catalogued as an agent-hijack prompt-injection product
  vulnerability.
date_disclosed: 2025-09-19
