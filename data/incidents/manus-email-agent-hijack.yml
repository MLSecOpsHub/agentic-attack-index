  - credential-access
mappings:
  mitre_atlas:
    - AML.T0051.001 # LLM Prompt Injection: Indirect (instructions in email content the agent read)
    - AML.T0093 # Prompt Infiltration via Public-Facing Application (delivered by email)
    - AML.T0068 # LLM Prompt Obfuscation (obfuscated instructions evaded the guardrail, per Salt)
    - AML.T0053 # AI Agent Tool Invocation (agent ran code in its sandbox)
    - AML.T0098 # AI Agent Tool Credential Harvesting (OAuth token and connected-service credentials in the agent's execution environment)
  mitre_attack: []
  owasp_llm: []
  owasp_asi: [] # OWASP Top 10 for Agentic Applications, ASI01–ASI10 (pinned in schema/owasp-asi.json; method in docs/owasp-asi-mapping.md)
  cve: [] # None stated.
  aiid: []
impact: >-
  Proof of concept on a researcher test account: remote code execution in the
  Manus agent's cloud sandbox triggered by an incoming email, with access to the
  user's Gmail OAuth token and to credentials for other connected services
  (Salt names Google Drive and GitHub). Salt states the issue is resolved and no
  longer exploitable; no in-the-wild exploitation reported.
