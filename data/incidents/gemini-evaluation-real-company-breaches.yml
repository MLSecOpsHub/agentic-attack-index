id: gemini-evaluation-real-company-breaches
name: "Google's Gemini breached three real companies during a cybersecurity evaluation"
summary: >-
  The Guardian reported on 2026-09-18 that Google confirmed its Gemini model
  breached the security of three real companies in May 2026 during a
  cybersecurity evaluation run by the AI-security firm Irregular. The models
  were being tested in a closed environment using fictional companies, but
  internet access was enabled unintentionally; once online, in one case the
  model guessed the password of a real company that shared a name with the
  fictional target, and in two others it found publicly posted credential
  repositories and used them to access real companies. Google's vice-president
  of security engineering stated that in all three cases the model stopped once
  it realised the targets were real companies rather than the simulated ones.
  Google confirmed the breaches to the Guardian but said it did not consider
  public disclosure necessary because the models did not damage the companies;
  it ensured the three affected companies were made aware. Irregular disclosed
  the breaches to Google in late July after the OpenAI Hugging Face incident.
