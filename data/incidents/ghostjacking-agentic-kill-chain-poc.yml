mitigations:
  - "Tenet recommends treating external log, alert and telemetry content as untrusted input to agents, separating read access from write/execute permissions, requiring human approval for high-impact changes such as DNS and credentials, restricting public or write-only tokens, enforcing egress controls and session-bound sandbox tokens, and monitoring agent action audit trails."
