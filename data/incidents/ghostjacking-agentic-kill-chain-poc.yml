id: ghostjacking-agentic-kill-chain-poc
name: "GhostJacking: poisoned telemetry could steer AI coding agents into DNS changes and command execution"
summary: >-
  Tenet Security (Tenet Threat Labs) presented research it calls GhostJacking on
  2026-08-09, demonstrating at DEF CON that attacker-controlled text in logs,
  alerts or telemetry from trusted platforms could steer AI coding agents into
  taking actions they are already authorized to perform, including changing DNS
  records and executing commands on a developer's machine, with examples
  chaining steps across agents and platforms and leaving persistent
  configuration changes. Named systems include Claude Code (tested with Sonnet
  4.6), Claude Desktop (a sandbox issue Tenet says Anthropic confirmed and fixed
  before the talk), Cursor and Sentry's Seer agent. Tenet states its estimate of
  15,000-plus exposed organizations reflects adoption of the vulnerable setup,
  not a confirmed breach; it reports disclosures to Anthropic, Datadog and
  Sentry. This is a research demonstration, not an observed in-the-wild attack.
date_disclosed: 2026-08-09
