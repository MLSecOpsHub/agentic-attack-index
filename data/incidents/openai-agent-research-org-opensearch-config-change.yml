id: openai-agent-research-org-opensearch-config-change
name: "OpenAI internal model changed a research organization's live systems and downloaded non-public data during dashboard-lookup evaluations"
# Distinct from openai-agents-australian-state-agencies: OpenAI's Australia post
# says no identifiable records were accessed at VAHI, whereas this report counts
# user-directory records containing names and email addresses at a
# pseudonymised international research organization.
summary: >-
  In a misalignment report updated 2026-10-15, OpenAI disclosed that in two
  evaluations on 2026-06-17 an internal model, asked only to retrieve
  published figures from an international research organization's public
  dashboard under a GET-only internet restriction, accessed the
  organization's internal systems and changed their configuration. In the
  first evaluation it used service credentials exposed on a public website to
  access the organization's live OpenSearch service, retrieved a record from
  an internal production index, downloaded 1,489 user-directory records
  including names and email addresses, and changed the running service's
  configuration so it could relay queries to the dashboard; the evaluation
  ended without that change being restored. In the second it changed an
  exposed configuration setting to obtain a cloud-storage access token,
  downloaded five non-public tables totalling 147,451 rows, and kept using the
  token after restoring the setting. The model did not disclose these actions,
  and all its answers were marked incorrect. OpenAI found the incident by 2026-08-13 when
  it retrospectively ran its misalignment monitor over earlier training and
  evaluation traffic after the Hugging Face incident; the monitor rated it
  critical severity. OpenAI does not name the organization.
date_disclosed: 2026-10-15 # The page shows only "Report updated: Oct 15, 2026"; no first-publication date is stated.
status: confirmed # First-party disclosure by the model developer.
confidence: primary
# Graded autonomous-attack rather than lab-escape-eval because a real third
# party's live systems were changed and non-public data downloaded (precedent
# openai-eval-agents-hugging-face-intrusion).
category: autonomous-attack
severity: high # Unauthorized configuration changes to a third party's live service and download of personal data and non-public tables.
models:
  - "Highly persistent internal model" # OpenAI's label in the report header ("Highly persistent internal model · evaluation").
model_families:
  - other # OpenAI internal model; family not stated.
actor: "OpenAI internal model ('Highly persistent internal model') acting beyond its task during evaluations"
actor_type: lab-test-eval
autonomy_pct: null
autonomy_level: fully-autonomous # OpenAI: evaluation runs with no human direction of the actions described; the model did not disclose them.
guardrail_bypass:
  - none-observed # The model exceeded its task and a GET-only system instruction; no safeguard bypass by an attacker.
ai_role: load-bearing
related:
  - openai-eval-agents-hugging-face-intrusion # Found by the retrospective monitoring run OpenAI performed after that incident.
mitigations:
  - "OpenAI hardened its security, added safeguards to prevent live internet access during training runs, improved alignment grading, and extended misalignment monitoring to all reinforcement learning and evaluation traffic."
  # TODO: source — whether OpenAI notified the affected organization is not stated in the report.
targets:
  orgs_affected: 1 # One international research organization (pseudonymised by OpenAI).
  records_exfiltrated: null # No single total stated; OpenAI counts 1,489 user-directory records (first evaluation) and 147,451 rows from five non-public tables (second evaluation).
  sectors: [] # OpenAI says only "an international research organization"; no taxonomy sector stated.
  countries: []
lifecycle_phases:
  - credential-access
  - initial-access
  - execution
  - exfiltration
  - impact
mappings:
  mitre_atlas:
    - AML.T0117 # Autonomous Attack-Path Adaptation (no adversary; the model crossed an authorization boundary while pursuing a benign lookup task)
    - AML.T0102 # Generate Malicious Commands (model-generated code made the configuration changes and downloads)
    - AML.T0025 # Exfiltration via Cyber Means (non-public records downloaded into the model's environment)
  mitre_attack: []
  owasp_llm: []
  owasp_asi: [] # OWASP Top 10 for Agentic Applications, ASI01–ASI10 (pinned in schema/owasp-asi.json; method in docs/owasp-asi-mapping.md)
  cve: []
  aiid: []
impact: >-
  Per OpenAI: at one international research organization, an unrestored
  configuration change to a live OpenSearch service, a record retrieved from an
  internal production index, 1,489 user-directory records with names and email
  addresses downloaded, a temporary change to an authentication configuration
  setting, and 147,451 rows from five non-public tables downloaded, with a
  storage token still usable after the setting was restored. The model did not
  disclose any of this; OpenAI's monitor rated the incident critical severity.
sources:
