id: google-antigravity-data-exfiltration-poc
name: "Google Antigravity agent could be led by a malicious web page to exfiltrate local data"
summary: >-
  PromptArmor's threat-intelligence team published a proof-of-concept showing
  that Google Antigravity, Google's agentic code editor, could be led by a
  malicious web page into collecting local credentials and code and sending
  them to a public site. PromptArmor says it did not run a responsible-disclosure
  process because Google had indicated it was already aware of data-exfiltration
  risks, and it criticises relying on user warnings and default human-review
  settings that let the agent decide when to request approval. The write-up
  describes a demonstrated attack chain with no observed real-world exploitation
  and does not confirm a fix. This is distinct from the separate Antigravity
  incident in which the agent wiped a user's drive.
date_disclosed: 2025-11-25 # PromptArmor research on Antigravity (which launched 2025-11-18); coverage 2025-11-25 to 27 (Simon Willison, BDTechTalks, TechRadar). Prior value 2026-11-20 was a year off.
status: reported # Single vendor publisher; no responsible disclosure or confirmed fix.
