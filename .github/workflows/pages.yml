name: pages

# Publish the built dataset (dist/) to GitHub Pages so consumers have a stable,
# hosted surface for incidents.json / summary.json / NDJSON / CSV / STIX bundle
# and the JSON Schema, rather than reading from raw.githubusercontent on main.
#
# Requires Pages to be enabled for the repo with Source = "GitHub Actions"
# (Settings → Pages). Until then this workflow is a no-op safety-wise.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Publish the schema alongside the data so consumers can pin a hosted copy.
      - run: cp schema/incident.schema.json dist/incident.schema.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
