name: linkcheck

# Sources rot. Run linkcheck on a schedule (network-dependent, so kept out of
# the deterministic `npm test` CI gate) and surface failures as a tracked issue.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    name: check source URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Run linkcheck
        id: linkcheck
        run: |
          set +e
          npm run linkcheck 2>&1 | tee linkcheck.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update issue on failure
        if: steps.linkcheck.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('linkcheck.log', 'utf8').slice(-5000);
            const title = 'linkcheck: broken source URL(s) detected';
            const marker = '<!-- linkcheck-bot -->';
            const body = `${marker}\nThe scheduled linkcheck found unreachable source URLs. ` +
              `Fix or add an \`archive_url\` for each affected record.\n\n` +
              `Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              '```\n' + log + '\n```';
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'linkcheck',
              per_page: 100,
            });
            const found = existing.find((i) => i.body && i.body.includes(marker));
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['linkcheck'],
                body,
              });
            }

      - name: Fail the job if linkcheck failed
        if: steps.linkcheck.outputs.exit_code != '0'
        run: exit 1
